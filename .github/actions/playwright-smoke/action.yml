name: "Playwright Smoke"
description: "Installs deps, runs Playwright tests against a BASE_URL, uploads report/traces/videos as artifacts."
inputs:
  working-directory:
    description: Path to the web app with Playwright config
    required: true
  base-url:
    description: Base URL to test against
    required: true
  artifact-name:
    description: Artifact name prefix
    required: true
  run-auth-smoke:
    description: Run deployed real-auth smoke (B2C popup login + /api/ping)
    required: false
    default: 'false'
  test-user-email-json-key:
    description: Optional E2E_SECRETS_JSON key to export as B2C_TEST_USER_EMAIL
    required: false
    default: ''
  test-user-password-json-key:
    description: Optional E2E_SECRETS_JSON key to export as B2C_TEST_USER_PASSWORD
    required: false
    default: ''
  browser-install-timeout-seconds:
    description: Maximum seconds to spend installing the Playwright Chromium browser
    required: false
    default: '300'
  system-deps-timeout-seconds:
    description: Maximum seconds to spend installing Linux packages required by Playwright
    required: false
    default: '600'
runs:
  using: composite
  steps:
    - name: Resolve and mask selected E2E credentials
      if: ${{ inputs.run-auth-smoke == 'true' }}
      shell: bash
      env:
        EMAIL_KEY: ${{ inputs.test-user-email-json-key }}
        PASSWORD_KEY: ${{ inputs.test-user-password-json-key }}
      run: |
        set -euo pipefail

        if [ -z "${E2E_SECRETS_JSON:-}" ] || [ "$E2E_SECRETS_JSON" = "{}" ]; then
          exit 0
        fi
        if ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"$E2E_SECRETS_JSON"; then
          echo "::error::E2E_SECRETS_JSON must be a valid JSON object."
          exit 1
        fi

        export_masked_value() {
          local target_name="$1"
          local json_key="$2"
          local value
          local delimiter

          [ -n "$json_key" ] || return 0
          value=$(jq -r --arg key "$json_key" '.[$key] // empty' <<<"$E2E_SECRETS_JSON")
          [ -n "$value" ] || return 0

          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<<"$value"

          delimiter="E2E_VALUE_$(date +%s%N)"
          {
            printf '%s<<%s\n' "$target_name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_ENV"
          echo "Configured $target_name from E2E_SECRETS_JSON key '$json_key' (value masked)."
        }

        export_masked_value "B2C_TEST_USER_EMAIL" "$EMAIL_KEY"
        export_masked_value "B2C_TEST_USER_PASSWORD" "$PASSWORD_KEY"

    - name: Install web dependencies
      shell: bash
      working-directory: ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}
      run: |
        npm ci --ignore-scripts || npm i --ignore-scripts

    - name: Install Playwright Chromium
      shell: bash
      working-directory: ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}
      env:
        BROWSER_INSTALL_TIMEOUT_SECONDS: ${{ inputs.browser-install-timeout-seconds }}
      run: |
        set -euo pipefail
        case "$BROWSER_INSTALL_TIMEOUT_SECONDS" in
          ''|*[!0-9]*) BROWSER_INSTALL_TIMEOUT_SECONDS=300 ;;
        esac
        echo "Installing Playwright Chromium browser (timeout ${BROWSER_INSTALL_TIMEOUT_SECONDS}s)..."
        set +e
        timeout "${BROWSER_INSTALL_TIMEOUT_SECONDS}s" npx playwright install chromium
        exit_code=$?
        set -e
        if [ "$exit_code" -eq 124 ]; then
          echo "::error::Playwright Chromium install timed out after ${BROWSER_INSTALL_TIMEOUT_SECONDS}s."
          exit 124
        fi
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::Playwright Chromium install failed with exit code ${exit_code}."
          exit "$exit_code"
        fi

    - name: Ensure Playwright system dependencies
      shell: bash
      working-directory: ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}
      env:
        SYSTEM_DEPS_TIMEOUT_SECONDS: ${{ inputs.system-deps-timeout-seconds }}
      run: |
        set -euo pipefail
        case "$SYSTEM_DEPS_TIMEOUT_SECONDS" in
          ''|*[!0-9]*) SYSTEM_DEPS_TIMEOUT_SECONDS=600 ;;
        esac

        probe='
          let chromium;
          try { chromium = require("@playwright/test").chromium; }
          catch { chromium = require("playwright").chromium; }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            await browser.close();
          })().catch((error) => {
            console.error(error && error.message ? error.message : error);
            process.exit(1);
          });
        '

        set +e
        node -e "$probe"
        probe_exit=$?
        set -e
        if [ "$probe_exit" -eq 0 ]; then
          echo "Playwright Chromium launch probe passed; Linux dependencies are already available."
          exit 0
        fi

        echo "Playwright Chromium launch probe failed; installing Linux dependencies (timeout ${SYSTEM_DEPS_TIMEOUT_SECONDS}s)..."
        set +e
        timeout "${SYSTEM_DEPS_TIMEOUT_SECONDS}s" npx playwright install-deps chromium
        deps_exit=$?
        set -e
        if [ "$deps_exit" -eq 124 ]; then
          echo "::error::Playwright Linux dependency install timed out after ${SYSTEM_DEPS_TIMEOUT_SECONDS}s."
          exit 124
        fi
        if [ "$deps_exit" -ne 0 ]; then
          echo "::error::Playwright Linux dependency install failed with exit code ${deps_exit}."
          exit "$deps_exit"
        fi

        node -e "$probe"

    - name: Run Playwright smoke
      shell: bash
      working-directory: ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        # Run smoke tests only (no auth-dependent tests)
        npm run test:e2e:smoke

    - name: Deployed auth smoke (real B2C)
      if: ${{ inputs.run-auth-smoke == 'true' }}
      shell: bash
      working-directory: ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        # Requires B2C_TEST_USER_EMAIL / B2C_TEST_USER_PASSWORD env vars set by the caller.
        npm run test:e2e:deployed-auth-smoke

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}/playwright-report/**
          ${{ env.CALLER_WORKDIR != '' && format('{0}/{1}', env.CALLER_WORKDIR, inputs.working-directory) || inputs.working-directory }}/test-results/**
        if-no-files-found: ignore
        retention-days: 7
