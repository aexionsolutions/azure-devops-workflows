name: Scheduled Environment Stop Guard
description: Prevents a scheduled environment stop outside its time window or while lifecycle workflows are active.

inputs:
  github-token:
    description: GitHub token with actions:read permission for the caller repository.
    required: true
  target-time:
    description: Scheduled stop time in HH:MM format in the configured timezone.
    required: true
  timezone:
    description: IANA timezone used to interpret target-time.
    required: false
    default: Europe/London
  window-minutes:
    description: Number of minutes after target-time during which a stop is eligible.
    required: false
    default: '60'
  protected-workflows:
    description: Comma-separated workflow file names whose active runs prevent stopping.
    required: false
    default: env-start.yml,promote-release.yml

outputs:
  should_stop:
    description: "'true' only when the current time is in-window and no protected workflow is active."
    value: ${{ steps.evaluate.outputs.should_stop }}
  reason:
    description: Machine-readable decision reason (eligible, outside-window, or active-workflow).
    value: ${{ steps.evaluate.outputs.reason }}
  current-time:
    description: Current HH:MM time in the configured timezone.
    value: ${{ steps.evaluate.outputs.current-time }}
  active-runs:
    description: Human-readable list of protected workflow runs that prevented stopping.
    value: ${{ steps.evaluate.outputs.active-runs }}

runs:
  using: composite
  steps:
    - name: Evaluate scheduled stop safety
      id: evaluate
      uses: actions/github-script@v9
      env:
        TARGET_TIME: ${{ inputs.target-time }}
        TIMEZONE: ${{ inputs.timezone }}
        WINDOW_MINUTES: ${{ inputs.window-minutes }}
        PROTECTED_WORKFLOWS: ${{ inputs.protected-workflows }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const target = process.env.TARGET_TIME;
          const match = /^([0-9]{1,2}):([0-9]{2})$/.exec(target);
          if (!match) {
            core.setFailed(`target-time must be HH:MM, got '${target}'.`);
            return;
          }

          const targetHour = Number(match[1]);
          const targetMinute = Number(match[2]);
          if (targetHour > 23 || targetMinute > 59) {
            core.setFailed(`target-time must be a valid 24-hour time, got '${target}'.`);
            return;
          }

          const windowMinutes = Number(process.env.WINDOW_MINUTES);
          if (!Number.isInteger(windowMinutes) || windowMinutes < 1 || windowMinutes > 1440) {
            core.setFailed(`window-minutes must be an integer from 1 to 1440, got '${process.env.WINDOW_MINUTES}'.`);
            return;
          }

          let parts;
          try {
            parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: process.env.TIMEZONE,
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23',
            }).formatToParts(new Date());
          } catch (error) {
            core.setFailed(`Invalid IANA timezone '${process.env.TIMEZONE}': ${error.message}`);
            return;
          }

          const currentHour = Number(parts.find(part => part.type === 'hour').value);
          const currentMinute = Number(parts.find(part => part.type === 'minute').value);
          const currentTime = `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;
          const currentMinutes = currentHour * 60 + currentMinute;
          const targetMinutes = targetHour * 60 + targetMinute;
          const elapsedMinutes = (currentMinutes - targetMinutes + 1440) % 1440;
          const inWindow = elapsedMinutes < windowMinutes;

          core.setOutput('current-time', currentTime);
          core.info(
            `Current ${process.env.TIMEZONE} time is ${currentTime}; target is ${target}; ` +
            `eligible window is ${windowMinutes} minute(s).`
          );

          if (!inWindow) {
            core.info(`Skipping scheduled stop: current time is outside the eligible window (elapsed=${elapsedMinutes} minutes).`);
            core.setOutput('should_stop', 'false');
            core.setOutput('reason', 'outside-window');
            core.setOutput('active-runs', '');
            return;
          }

          const workflowIds = process.env.PROTECTED_WORKFLOWS
            .split(',')
            .map(value => value.trim())
            .filter(Boolean);
          const active = [];

          for (const workflow_id of workflowIds) {
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.status !== 'completed') {
                active.push(`${workflow_id} #${run.run_number} (${run.status})`);
              }
            }
          }

          if (active.length > 0) {
            const activeRuns = active.join(', ');
            core.warning(`Skipping scheduled stop: protected lifecycle workflow active — ${activeRuns}.`);
            core.setOutput('should_stop', 'false');
            core.setOutput('reason', 'active-workflow');
            core.setOutput('active-runs', activeRuns);
            return;
          }

          core.info('Scheduled stop is eligible: inside the configured window with no protected lifecycle workflow active.');
          core.setOutput('should_stop', 'true');
          core.setOutput('reason', 'eligible');
          core.setOutput('active-runs', '');
