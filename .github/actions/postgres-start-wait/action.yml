name: Postgres Start & Wait (Flexible Server)

description: Starts the required Azure PostgreSQL Flexible Server and waits until Ready. Metadata lookup failures are fatal.

inputs:
  resource-group:
    description: Azure Resource Group containing the server
    required: true
  server-name:
    description: PostgreSQL Flexible Server resource name
    required: true
  attempts:
    description: Number of polling attempts (default 60)
    required: false
    default: '60'
  sleep-seconds:
    description: Seconds to sleep between polls (default 10)
    required: false
    default: '10'
  non-blocking:
    description: true to skip failure if server does not reach Ready (best-effort start)
    required: false
    default: 'false'
  api-version:
    description: ARM API version for Flexible Server
    required: false
    default: '2024-08-01'

runs:
  using: composite
  steps:
    - name: Start Postgres Flexible Server and wait
      id: pg
      shell: bash
      env:
        RG: ${{ inputs.resource-group }}
        PG_NAME: ${{ inputs.server-name }}
        ATTEMPTS: ${{ inputs.attempts }}
        SLEEP_SECS: ${{ inputs.sleep-seconds }}
        NON_BLOCKING: ${{ inputs.non-blocking }}
        API_VER: ${{ inputs.api-version }}
      run: |
        set -euo pipefail
        SUB_ID=$(az account show --query id -o tsv)
        SERVER_URL="https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.DBforPostgreSQL/flexibleServers/$PG_NAME?api-version=$API_VER"
        # Use the same explicit API version for existence and state. A failed
        # lookup (including authorization, API-version or missing-resource errors)
        # cannot establish absence and must never report successful startup.
        STATE=$(az rest --method get --url "$SERVER_URL" --query properties.state -o tsv)
        if [ "$STATE" = "Ready" ]; then
          echo "Postgres is already Ready."
          exit 0
        fi
        # Attempt to start (best-effort; may fail if server is mid-transition)
        echo "Starting Postgres server $PG_NAME..."
        az rest --method post \
          --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.DBforPostgreSQL/flexibleServers/$PG_NAME/start?api-version=$API_VER" \
          --headers "Content-Type=application/json" || echo "⚠️ Start request failed (server may be busy); will retry during polling."
        # Poll until Ready
        ready=false
        start_issued=true
        for i in $(seq 1 "$ATTEMPTS"); do
          STATE=$(az rest --method get \
            --url "$SERVER_URL" \
            --query properties.state -o tsv)
          echo "[$i/$ATTEMPTS] PG state: ${STATE:-<unknown>}"
          if [ "$STATE" = "Ready" ]; then ready=true; break; fi
          # If server finished stopping/is stopped, re-issue start
          if [ "$STATE" = "Stopped" ] && [ "$start_issued" != "retry" ]; then
            echo "Server is Stopped — re-issuing start command..."
            az rest --method post \
              --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.DBforPostgreSQL/flexibleServers/$PG_NAME/start?api-version=$API_VER" \
              --headers "Content-Type=application/json" || echo "⚠️ Retry start also failed; will keep polling."
            start_issued="retry"
          fi
          sleep "$SLEEP_SECS"
        done
        if [ "$ready" != true ]; then
          echo "Postgres did not reach Ready state within $((ATTEMPTS*SLEEP_SECS)) seconds."
          if [ "$NON_BLOCKING" = "true" ]; then
            echo "Continuing (non-blocking)."
            exit 0
          else
            echo "Failing (blocking mode)."
            exit 1
          fi
        fi
        echo "Postgres is Ready."
