name: 'E2E: run the Playwright suite'
description: >-
  Runs the caller's Playwright (TypeScript) suite, or one shard of it, against the web app e2e-start-stack started,
  and uploads its report and test results.

inputs:
  web_directory: { description: 'Web app directory, relative to the caller repo', required: true }
  web_port: { description: 'Web port', required: true }
  shard: { description: 'Playwright shard (e.g. 1/2); empty runs the whole suite', required: false, default: '' }
  max_failures: { description: 'Stop once this many tests still fail after their retries (--max-failures); 0 disables', required: false, default: '10' }
  run_smoke_only: { description: 'Run only the smoke config or @smoke tests', required: false, default: 'false' }
  smoke_config: { description: 'Playwright config for smoke-only runs', required: false, default: '' }
  b2c_authority: { description: 'B2C authority', required: false, default: '' }
  b2c_client_id: { description: 'B2C client id', required: false, default: '' }
  b2c_scope: { description: 'B2C API scope', required: false, default: '' }
  b2c_client_secret: { description: 'B2C client secret', required: false, default: '' }
  artifact_suffix: { description: 'Suffix for artifact names (keeps each job''s artifacts distinct)', required: false, default: '' }

runs:
  using: composite
  steps:
    - name: Install Playwright browsers
      shell: bash
      working-directory: caller/${{ inputs.web_directory }}
      run: |
        echo "📦 Installing Playwright browsers..."
        npx playwright install --with-deps chromium

    - name: Run Playwright tests
      shell: bash
      working-directory: caller/${{ inputs.web_directory }}
      env:
        BASE_URL: http://localhost:${{ inputs.web_port }}
        START_WEB_SERVER: "false"
        PLAYWRIGHT_SHARD: ${{ inputs.shard }}
        PLAYWRIGHT_MAX_FAILURES: ${{ inputs.max_failures }}
        B2C_AUTHORITY: ${{ inputs.b2c_authority }}
        B2C_CLIENT_ID: ${{ inputs.b2c_client_id }}
        B2C_SCOPE: ${{ inputs.b2c_scope }}
        B2C_CLIENT_SECRET: ${{ inputs.b2c_client_secret }}
        RUN_SMOKE_ONLY: ${{ inputs.run_smoke_only }}
        SMOKE_CONFIG: ${{ inputs.smoke_config }}
        # Additional E2E env vars and secrets were loaded into the job environment by e2e-start-stack
      run: |
        echo "🧪 Running Playwright tests..."
        PLAYWRIGHT_ARGS=()
        if [ -n "$PLAYWRIGHT_SHARD" ]; then
          PLAYWRIGHT_ARGS+=(--shard="$PLAYWRIGHT_SHARD")
          echo "ℹ️  Shard $PLAYWRIGHT_SHARD"
        fi
        # A broken build fails every test, each on every retry, each only after its timeout: stop early instead.
        if [ "${PLAYWRIGHT_MAX_FAILURES:-0}" -gt 0 ]; then
          PLAYWRIGHT_ARGS+=(--max-failures="$PLAYWRIGHT_MAX_FAILURES")
          echo "ℹ️  Stops once $PLAYWRIGHT_MAX_FAILURES tests are still failing after their retries"
        fi

        if [ "$RUN_SMOKE_ONLY" = "true" ]; then
          echo "ℹ️  Running smoke tests only..."
          if [ -n "$SMOKE_CONFIG" ]; then
            echo "   Config: $SMOKE_CONFIG"
            npx playwright test --config="$SMOKE_CONFIG" --reporter=list "${PLAYWRIGHT_ARGS[@]}"
          else
            echo "⚠️  No playwright_smoke_config provided, running tests with @smoke tag..."
            npx playwright test --grep @smoke --reporter=list "${PLAYWRIGHT_ARGS[@]}"
          fi
        else
          echo "ℹ️  Running all Playwright tests..."
          npx playwright test --reporter=list "${PLAYWRIGHT_ARGS[@]}"
        fi

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-e2e-${{ github.run_number }}${{ inputs.artifact_suffix }}
        path: |
          caller/${{ inputs.web_directory }}/playwright-report/**
          caller/${{ inputs.web_directory }}/test-results/**
        if-no-files-found: ignore
        retention-days: 7
