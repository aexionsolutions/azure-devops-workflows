name: 'Smart .NET Test Retry'
description: 'Run dotnet tests with smart retry - only re-runs failed tests instead of entire suite'
author: 'DevOps Team'
# v4.3.0: Fixed critical infrastructure failure detection bug
# v4.3.2: TRX missing on retry → fall back to last known failure list instead of aborting
# v4.4.0: Track NotExecuted/Inconclusive TRX outcomes so summary totals add up; retry NotExecuted tests

inputs:
  project:
    description: 'Path to .csproj file or directory to test'
    required: true
  filter:
    description: 'Test filter (e.g., Category=smoke). Leave empty for all tests.'
    required: false
    default: ''
  max-attempts:
    description: 'Maximum number of test attempts (1 disables retry)'
    required: false
    default: '3'
  results-directory:
    description: 'Directory to store test results (.trx files)'
    required: false
    default: './TestResults'
  configuration:
    description: 'Build configuration (Debug/Release)'
    required: false
    default: 'Release'
  no-build:
    description: 'Skip building the test project (true/false)'
    required: false
    default: 'false'
  additional-args:
    description: 'Additional arguments to pass to dotnet test'
    required: false
    default: ''
  trx-filename-prefix:
    description: 'Prefix for TRX log filenames (results will be <prefix>-1.trx, <prefix>-2.trx, etc.)'
    required: false
    default: 'test-results'
  dry-run-trx:
    description: 'If set, do not run tests; only parse this TRX and print the computed retry filter'
    required: false
    default: ''
  console-verbosity:
    description: 'Console logger verbosity: quiet|minimal|normal|detailed'
    required: false
    default: 'normal'

outputs:
  exit-code:
    description: 'Exit code from the test run (0 = success, non-zero = failure)'
    value: ${{ steps.test-retry.outputs.exit-code }}
  attempts-used:
    description: 'Number of attempts used'
    value: ${{ steps.test-retry.outputs.attempts-used }}
  failed-tests-count:
    description: 'Number of tests that failed on first attempt'
    value: ${{ steps.test-retry.outputs.failed-tests-count }}
  failed-tests-last-count:
    description: 'Number of tests that failed on the final attempt'
    value: ${{ steps.test-retry.outputs.failed-tests-last-count }}
  failed-tests-last:
    description: 'Pipe-delimited list of failed tests (Fully Qualified Names) on the final attempt'
    value: ${{ steps.test-retry.outputs.failed-tests-last }}

runs:
  using: 'composite'
  steps:
    - name: Smart test retry
      id: test-retry
      shell: pwsh
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INPUT_RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        INPUT_TRX_FILENAME_PREFIX: ${{ inputs.trx-filename-prefix }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_NO_BUILD: ${{ inputs.no-build }}
        INPUT_ADDITIONAL_ARGS: ${{ inputs.additional-args }}
        INPUT_DRY_RUN_TRX: ${{ inputs.dry-run-trx }}
        INPUT_CONSOLE_VERBOSITY: ${{ inputs.console-verbosity }}
      run: |
        & "${{ github.action_path }}/Invoke-SmartTestRetry.ps1"
