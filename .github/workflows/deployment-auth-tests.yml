name: Deployment authentication tests
on:
  pull_request:
    paths:
      - '.github/scripts/mint-external-id-smoke*'
      - '.github/workflows/deploy-template-api.yml'
      - '.github/workflows/deployment-auth-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/mint-external-id-smoke*'
      - '.github/workflows/deploy-template-api.yml'
      - '.github/workflows/deployment-auth-tests.yml'
permissions:
  contents: read
jobs:
  external-id-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test .github/scripts/mint-external-id-smoke.test.cjs
