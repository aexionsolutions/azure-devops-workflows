name: Action Tests

# Tests for this repository's own action scripts (not a reusable workflow).
on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/action-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/action-tests.yml'

permissions:
  contents: read

jobs:
  postgres-start:
    name: PostgreSQL startup contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test .github/actions/postgres-start-wait/startup.test.cjs
  pester:
    name: Pester (action scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Pester tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.6.1
          $result = Invoke-Pester -Path .github/actions -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
