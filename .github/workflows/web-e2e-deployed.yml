name: Reusable E2E Tests (Deployed Environment)

on:
  workflow_call:
    inputs:
      # Git Reference
      git_ref:
        description: 'Git ref to checkout (tag, branch, or commit SHA). Use release tag to ensure test version matches deployed code.'
        required: false
        type: string
        default: ''
      
      shared_ref:
        description: 'Ref (tag/sha/branch) of aexionsolutions/azure-devops-workflows to checkout into ./shared. Set this to the same @ref used in the calling repo. If omitted, defaults to main.'
        required: false
        type: string
        default: ''
      
      # Test Configuration
      e2e_project:
        description: 'Path to Reqnroll/NUnit E2E test project (.csproj). If empty, Reqnroll tests are skipped.'
        required: false
        type: string
        default: ''
      
      # Deployed Environment URLs
      web_url:
        description: 'Deployed web application URL (e.g., https://tems-dev-web.azurewebsites.net)'
        required: true
        type: string
      
      api_url:
        description: 'Deployed API URL (e.g., https://tems-dev-api.azurewebsites.net)'
        required: true
        type: string
      
      # Test Execution Options
      test_filter:
        description: 'Reqnroll test filter (e.g., @smoke, @regression, @critical). Empty = all tests.'
        required: false
        type: string
        default: '@smoke'
      
      run_playwright_tests:
        description: 'Run Playwright tests from web_directory'
        required: false
        type: boolean
        default: true
      
      playwright_project:
        description: 'Playwright project to run (e.g., chromium, firefox). Empty = all projects.'
        required: false
        type: string
        default: ''
      
      e2e_retry_attempts:
        description: 'Number of retry attempts for flaky tests (default: 3 for deployed envs)'
        required: false
        type: number
        default: 3
      
      e2e_enable_video:
        description: 'Enable video recording for tests (increases artifact size)'
        required: false
        type: boolean
        default: false
      
      console_verbosity:
        description: 'Console logger verbosity for dotnet test (quiet, minimal, normal, detailed, diagnostic)'
        required: false
        type: string
        default: 'normal'
      
      # Infrastructure
      node_version:
        description: 'Node.js version for Playwright tests'
        required: false
        type: string
        default: '20'
      
      dotnet_version:
        description: '.NET version for Reqnroll tests'
        required: false
        type: string
        default: '10.0.x'
      
      web_directory:
        description: 'Path to web project directory (required if run_playwright_tests is true)'
        required: false
        type: string
        default: ''
      
      # Health Check Configuration
      health_check_enabled:
        description: 'Perform health checks before running tests'
        required: false
        type: boolean
        default: true
      
      health_check_timeout:
        description: 'Health check timeout in seconds'
        required: false
        type: number
        default: 300
      
      # Authentication
      api_key:
        description: 'API key for deployed environment (if required)'
        required: false
        type: string
        default: ''
      
      # Environment Configuration
      environment_name:
        description: 'Environment name (dev, uat, preprod, prod) - used for loading appsettings.{env}.json'
        required: false
        type: string
        default: ''
      
      # Database Configuration
      database_connection_string:
        description: 'Database connection string for E2E tests (overrides default)'
        required: false
        type: string
        default: ''
      
      # Azure Key Vault (alternative to direct connection string)
      azure_keyvault_name:
        description: 'Azure Key Vault name to retrieve secrets from'
        required: false
        type: string
        default: ''
      
      azure_keyvault_secret_name:
        description: 'Secret name in Key Vault for database connection string'
        required: false
        type: string
        default: 'PostgresConnectionString'
      
      # Generic E2E environment variables (pass any test-specific env vars as JSON)
      e2e_env_vars:
        description: 'Additional E2E environment variables as JSON string (e.g., {"E2E_ADMIN_EMAIL":"admin@test.com", "CUSTOM_VAR":"value"}). Secrets should be passed via e2e_secrets.'
        required: false
        type: string
        default: '{}'
      
      # B2C Configuration (non-sensitive, passed as inputs)
      b2c_authority:
        description: 'Azure B2C authority URL (e.g., https://yourtenantname.b2clogin.com/yourtenantname.onmicrosoft.com/B2C_1A_SIGNUP_SIGNIN)'
        required: false
        type: string
        default: ''
      b2c_client_id:
        description: 'Azure B2C client ID for E2E tests'
        required: false
        type: string
        default: ''
      b2c_scope:
        description: 'Azure B2C API scope (e.g., https://yourtenantname.onmicrosoft.com/api/access_as_user)'
        required: false
        type: string
        default: ''
    
    secrets:
      # Azure Authentication (required if using Key Vault with OIDC)
      AZURE_CLIENT_ID:
        description: 'Azure Client ID for Key Vault access (workload identity)'
        required: false
      AZURE_TENANT_ID:
        description: 'Azure Tenant ID for Key Vault access'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Azure Subscription ID for Key Vault access'
        required: false
      AZURE_CREDENTIALS:
        description: 'Azure credentials JSON (legacy service principal auth method)'
        required: false
      E2E_AUTH_TOKEN:
        description: 'Authentication token for deployed environment (if required)'
        required: false
      DATABASE_CONNECTION_STRING:
        description: 'Database connection string (alternative to using Key Vault)'
        required: false
      # B2C client secret (sensitive)
      b2c_client_secret:
        description: 'Azure B2C client secret for E2E test user ROPC flow'
        required: false
      # Generic secret passthrough for test-specific secrets (personas, API keys, etc.)
      e2e_secrets:
        description: 'Additional E2E secrets as JSON string (e.g., {"E2E_ADMIN_USER_EMAIL":"admin@test.com", "E2E_ADMIN_USER_PASSWORD":"secret123"}). These will be masked in logs.'
        required: false
      # Legacy B2C secrets (for backwards compatibility)
      AAD_B2C_AUTHORITY:
        description: 'Legacy: Azure B2C authority URL (prefer inputs.b2c_authority)'
        required: false
      B2C_SMOKE_CLIENT_ID:
        description: 'Legacy: Azure B2C client ID (prefer inputs.b2c_client_id)'
        required: false
      AAD_B2C_API_SCOPE:
        description: 'Legacy: Azure B2C API scope (prefer inputs.b2c_scope)'
        required: false
      B2C_SMOKE_CLIENT_SECRET:
        description: 'Legacy: Azure B2C client secret (prefer secrets.b2c_client_secret)'
        required: false

jobs:
  e2e-deployed:
    name: E2E Tests (Deployed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Grant permissions for Azure workload identity (OIDC)
    permissions:
      id-token: write
      contents: read
    
    defaults:
      run:
        working-directory: caller
    
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.shared_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF="main"
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"
      
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}
          path: caller
      
      # Checkout shared workflows for composite actions (azure-login-smart, dotnet-test-retry)
      - name: Checkout shared workflows repo
        uses: actions/checkout@v4
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          fetch-depth: 0
          path: shared
      
      # Azure Login (if Key Vault is used)
      - name: Azure login
        if: inputs.azure_keyvault_name != ''
        uses: ./shared/.github/actions/azure-login-smart
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      # Retrieve database connection string from Azure Key Vault
      - name: Get database connection string from Key Vault
        if: inputs.azure_keyvault_name != ''
        id: get_db_conn
        shell: bash
        run: |
          echo "🔐 Retrieving database connection string from Key Vault: ${{ inputs.azure_keyvault_name }}"
          
          CONN_STR=$(az keyvault secret show \
            --vault-name "${{ inputs.azure_keyvault_name }}" \
            --name "${{ inputs.azure_keyvault_secret_name }}" \
            --query value -o tsv)
          
          if [ -z "$CONN_STR" ]; then
            echo "❌ Failed to retrieve connection string from Key Vault"
            exit 1
          fi
          
          echo "✅ Successfully retrieved connection string from Key Vault"
          echo "::add-mask::$CONN_STR"
          
          # Use heredoc format with random delimiter for safe multi-line output
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "connection_string<<${DELIM}"
            echo "$CONN_STR"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      
      # Health Checks
      - name: Health Check - API
        if: inputs.health_check_enabled
        run: |
          echo "🏥 Checking API health: ${{ inputs.api_url }}"
          
          timeout=${{ inputs.health_check_timeout }}
          elapsed=0
          interval=10
          
          while [ $elapsed -lt $timeout ]; do
            if curl -f -s "${{ inputs.api_url }}/healthz" > /dev/null 2>&1 || \
               curl -f -s "${{ inputs.api_url }}/health" > /dev/null 2>&1 || \
               curl -f -s "${{ inputs.api_url }}" > /dev/null 2>&1; then
              echo "✅ API is healthy"
              exit 0
            fi
            
            echo "⏳ API not ready yet... waiting (${elapsed}s / ${timeout}s)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "❌ API health check failed after ${timeout}s"
          exit 1
      
      - name: Health Check - Web
        if: inputs.health_check_enabled
        run: |
          echo "🏥 Checking Web health: ${{ inputs.web_url }}"
          
          timeout=${{ inputs.health_check_timeout }}
          elapsed=0
          interval=10
          
          while [ $elapsed -lt $timeout ]; do
            if curl -f -s "${{ inputs.web_url }}/api/healthz" > /dev/null 2>&1 || \
               curl -f -s "${{ inputs.web_url }}" > /dev/null 2>&1; then
              echo "✅ Web is healthy"
              exit 0
            fi
            
            echo "⏳ Web not ready yet... waiting (${elapsed}s / ${timeout}s)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "❌ Web health check failed after ${timeout}s"
          exit 1
      
      # Setup .NET for Reqnroll tests
      - name: Setup .NET
        if: inputs.e2e_project != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      
      # Setup Node.js for Playwright tests
      - name: Setup Node.js
        if: inputs.run_playwright_tests && inputs.web_directory != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: caller/${{ inputs.web_directory }}/package-lock.json
      
      # Install Playwright dependencies
      - name: Install Playwright dependencies
        if: inputs.run_playwright_tests && inputs.web_directory != ''
        working-directory: caller/${{ inputs.web_directory }}
        run: |
          npm ci
          npx playwright install --with-deps
      
      # Install Playwright browsers for Reqnroll tests (if using Microsoft.Playwright)
      - name: Install Playwright for Reqnroll
        if: inputs.e2e_project != ''
        shell: bash
        run: |
          # Check if project uses Microsoft.Playwright
          if grep -q "Microsoft.Playwright" "${{ inputs.e2e_project }}"; then
            echo "📦 Installing Playwright browsers for Reqnroll tests..."
            proj_dir="$(dirname "${{ inputs.e2e_project }}")"
            dotnet build "${{ inputs.e2e_project }}" --nologo
            # Find playwright.ps1 in any bin subfolder (handles Debug/Release + any target framework)
            PLAYWRIGHT_SCRIPT=$(find "$proj_dir" -path "*/bin/*/*/playwright.ps1" 2>/dev/null | head -n1)
            if [ -n "$PLAYWRIGHT_SCRIPT" ]; then
              pwsh "$PLAYWRIGHT_SCRIPT" install chromium --with-deps
            else
              echo "⚠️ playwright.ps1 not found; skipping browser install (Playwright may auto-install on first run)"
            fi
          else
            echo "ℹ️ Reqnroll tests don't use Microsoft.Playwright - skipping browser installation"
          fi
      
      # Set database connection string conditionally (only when non-empty)
      - name: Set database connection string
        if: inputs.e2e_project != ''
        shell: bash
        run: |
          # Priority: Key Vault > direct input > secret > not set
          CONN_STR="${{ steps.get_db_conn.outputs.connection_string || inputs.database_connection_string || secrets.DATABASE_CONNECTION_STRING }}"
          
          if [ -n "$CONN_STR" ]; then
            echo "✅ Database connection string configured"
            # Mask and write safely using heredoc (handles special chars/multiline)
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$CONN_STR"
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "ConnectionStrings__Postgres<<${DELIM}"
              echo "$CONN_STR"
              echo "${DELIM}"
            } >> "$GITHUB_ENV"
            # Also set Default for apps that use it
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "ConnectionStrings__Default<<${DELIM}"
              echo "$CONN_STR"
              echo "${DELIM}"
            } >> "$GITHUB_ENV"
            # Also set E2E-specific env var for Reqnroll DatabaseHelper
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "E2E_DATABASE_CONNECTION_STRING<<${DELIM}"
              echo "$CONN_STR"
              echo "${DELIM}"
            } >> "$GITHUB_ENV"
          else
            echo "ℹ️  No database connection string provided; tests will use default/local configuration"
          fi
      
      - name: Load E2E environment variables from JSON
        env:
          E2E_ENV_VARS_JSON: ${{ inputs.e2e_env_vars }}
        run: |
          # Load additional E2E environment variables from JSON input
          if [ -n "$E2E_ENV_VARS_JSON" ] && [ "$E2E_ENV_VARS_JSON" != "{}" ]; then
            echo "📦 Loading additional E2E environment variables..."
            # Validate JSON syntax
            if ! echo "$E2E_ENV_VARS_JSON" | jq -e . >/dev/null 2>&1; then
              echo "❌ Error: Invalid e2e_env_vars JSON syntax"
              exit 1
            fi
            # Write to temp file, then append to GITHUB_ENV using heredoc (safe for multi-line/special chars)
            TEMP_FILE=$(mktemp)
            echo "$E2E_ENV_VARS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' > "$TEMP_FILE"
            echo "Loaded environment variable keys:"
            cut -f1 "$TEMP_FILE" | sed 's/^/  - /'
            while IFS=$'\t' read -r key value; do
              DELIM="EOF_$(openssl rand -hex 8)"
              {
                echo "${key}<<${DELIM}"
                echo "${value}"
                echo "${DELIM}"
              } >> "$GITHUB_ENV"
            done < "$TEMP_FILE"
            rm -f "$TEMP_FILE"
            echo "✅ E2E environment variables loaded"
          else
            echo "ℹ️  No additional E2E environment variables to load"
          fi
      
      - name: Load E2E secrets from JSON
        env:
          E2E_SECRETS_JSON: ${{ secrets.e2e_secrets }}
        run: |
          # Load additional E2E secrets from JSON input (and mask them)
          if [ -n "$E2E_SECRETS_JSON" ] && [ "$E2E_SECRETS_JSON" != "{}" ]; then
            echo "🔐 Loading additional E2E secrets from JSON..."
            # Validate JSON syntax
            if ! echo "$E2E_SECRETS_JSON" | jq -e . >/dev/null 2>&1; then
              echo "❌ Error: Invalid e2e_secrets JSON syntax"
              exit 1
            fi
            # Write to temp file, mask values, then append to GITHUB_ENV using heredoc (safe for multi-line/special chars)
            TEMP_FILE=$(mktemp)
            echo "$E2E_SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' > "$TEMP_FILE"
            echo "Loaded secret keys:"
            cut -f1 "$TEMP_FILE" | sed 's/^/  - /'
            while IFS=$'\t' read -r key value; do
              # Mask secrets: full value first (for single-line), then line-by-line (for multi-line)
              if [[ "$value" != *$'\n'* ]]; then
                # Single-line secret: mask the whole value
                echo "::add-mask::$value"
              else
                # Multi-line secret: mask line-by-line (::add-mask:: doesn't handle embedded newlines)
                while IFS= read -r line; do
                  [ -n "$line" ] && echo "::add-mask::$line"
                done <<< "$value"
              fi
              DELIM="EOF_$(openssl rand -hex 8)"
              {
                echo "${key}<<${DELIM}"
                echo "${value}"
                echo "${DELIM}"
              } >> "$GITHUB_ENV"
            done < "$TEMP_FILE"
            rm -f "$TEMP_FILE"
            echo "✅ E2E secrets loaded and masked"
          else
            echo "ℹ️  No additional E2E secrets to load"
          fi
      
      # Run Reqnroll E2E Tests
      - name: Log Reqnroll E2E configuration
        if: inputs.e2e_project != ''
        run: |
          echo "🧪 Reqnroll E2E Test Configuration"
          echo "   Web URL: ${{ inputs.web_url }}"
          echo "   API URL: ${{ inputs.api_url }}"
          
          # Log B2C configuration source (helps debug fallback paths without leaking secrets)
          echo "🔐 B2C Configuration:"
          if [ -n "${{ inputs.b2c_authority }}" ]; then
            echo "  ✅ B2C_AUTHORITY from inputs.b2c_authority"
          elif [ -n "${{ secrets.AAD_B2C_AUTHORITY }}" ]; then
            echo "  📖 B2C_AUTHORITY from legacy secrets.AAD_B2C_AUTHORITY"
          else
            echo "  ⚠️ B2C_AUTHORITY not configured"
          fi
          
          if [ -n "${{ inputs.b2c_client_id }}" ]; then
            echo "  ✅ B2C_CLIENT_ID from inputs.b2c_client_id"
          elif [ -n "${{ secrets.B2C_SMOKE_CLIENT_ID }}" ]; then
            echo "  📖 B2C_CLIENT_ID from legacy secrets.B2C_SMOKE_CLIENT_ID"
          else
            echo "  ⚠️ B2C_CLIENT_ID not configured"
          fi
          
          if [ -n "${{ inputs.b2c_scope }}" ]; then
            echo "  ✅ B2C_SCOPE from inputs.b2c_scope"
          elif [ -n "${{ secrets.AAD_B2C_API_SCOPE }}" ]; then
            echo "  📖 B2C_SCOPE from legacy secrets.AAD_B2C_API_SCOPE"
          else
            echo "  ⚠️ B2C_SCOPE not configured"
          fi
          
          if [ -n "${{ secrets.b2c_client_secret }}" ]; then
            echo "  ✅ B2C_CLIENT_SECRET from secrets.b2c_client_secret"
          elif [ -n "${{ secrets.B2C_SMOKE_CLIENT_SECRET }}" ]; then
            echo "  📖 B2C_CLIENT_SECRET from legacy secrets.B2C_SMOKE_CLIENT_SECRET"
          else
            echo "  ⚠️ B2C_CLIENT_SECRET not configured"
          fi
          echo "   Filter: ${{ inputs.test_filter || 'all tests' }}"
          echo "   Retry attempts: ${{ inputs.e2e_retry_attempts }}"

      - name: Prepare test filter
        id: filter
        run: |
          # Strip @ prefix from Gherkin tags (e.g., @smoke -> smoke)
          FILTER="${{ inputs.test_filter }}"
          FILTER="${FILTER#@}"
          
          # Build category filter if provided
          if [ -n "$FILTER" ]; then
            echo "filter=Category=$FILTER" >> $GITHUB_OUTPUT
          else
            echo "filter=" >> $GITHUB_OUTPUT
          fi

      - name: Run Reqnroll E2E tests
        if: inputs.e2e_project != ''
        uses: ./shared/.github/actions/dotnet-test-retry
        env:
          RUN_E2E: true
          E2E_ENVIRONMENT: ${{ inputs.environment_name }}
          E2E_BASE_URL: ${{ inputs.web_url }}
          E2E_API_BASE_URL: ${{ inputs.api_url }}
          E2E_HEADLESS: true
          E2E_SLOWMO: 0
          E2E_ENABLE_VIDEO: ${{ inputs.e2e_enable_video }}
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_API_KEY: ${{ inputs.api_key }}
          E2E_RETRY_ATTEMPTS: ${{ inputs.e2e_retry_attempts }}
          # B2C Configuration (with backwards compatibility for legacy secret names)
          B2C_AUTHORITY: ${{ inputs.b2c_authority != '' && inputs.b2c_authority || secrets.AAD_B2C_AUTHORITY }}
          B2C_CLIENT_ID: ${{ inputs.b2c_client_id != '' && inputs.b2c_client_id || secrets.B2C_SMOKE_CLIENT_ID }}
          B2C_SCOPE: ${{ inputs.b2c_scope != '' && inputs.b2c_scope || secrets.AAD_B2C_API_SCOPE }}
          B2C_CLIENT_SECRET: ${{ secrets.b2c_client_secret != '' && secrets.b2c_client_secret || secrets.B2C_SMOKE_CLIENT_SECRET }}
          # ConnectionStrings__Postgres and ConnectionStrings__Default set in previous step (only when non-empty)
          # Additional E2E env vars and secrets loaded from JSON in previous steps
        with:
          project: caller/${{ inputs.e2e_project }}
          filter: ${{ steps.filter.outputs.filter }}
          max-attempts: ${{ inputs.e2e_retry_attempts }}
          results-directory: ./TestResults
          trx-filename-prefix: reqnroll-results
          console-verbosity: ${{ inputs.console_verbosity }}
      
      # Run Playwright Tests
      - name: Run Playwright tests
        if: inputs.run_playwright_tests && inputs.web_directory != ''
        working-directory: caller/${{ inputs.web_directory }}
        env:
          BASE_URL: ${{ inputs.web_url }}
          API_BASE_URL: ${{ inputs.api_url }}
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_API_KEY: ${{ inputs.api_key }}
          # B2C Configuration (with backwards compatibility for legacy secret names)
          B2C_AUTHORITY: ${{ inputs.b2c_authority != '' && inputs.b2c_authority || secrets.AAD_B2C_AUTHORITY }}
          B2C_CLIENT_ID: ${{ inputs.b2c_client_id != '' && inputs.b2c_client_id || secrets.B2C_SMOKE_CLIENT_ID }}
          B2C_SCOPE: ${{ inputs.b2c_scope != '' && inputs.b2c_scope || secrets.AAD_B2C_API_SCOPE }}
          B2C_CLIENT_SECRET: ${{ secrets.b2c_client_secret != '' && secrets.b2c_client_secret || secrets.B2C_SMOKE_CLIENT_SECRET }}
          # Additional E2E env vars and secrets loaded from JSON in previous steps
        run: |
          echo "🎭 Running Playwright tests against deployed environment"
          echo "   Web URL: ${{ inputs.web_url }}"
          echo "   API URL: ${{ inputs.api_url }}"
          echo "   Project: ${{ inputs.playwright_project || 'all projects' }}"
          echo "   Retry attempts: ${{ inputs.e2e_retry_attempts }}"
          
          project_arg=""
          if [ -n "${{ inputs.playwright_project }}" ]; then
            project_arg="--project=${{ inputs.playwright_project }}"
          fi
          
          video_arg=""
          if [ "${{ inputs.e2e_enable_video }}" = "true" ]; then
            video_arg="--video=on"
          fi
          
          npx playwright test $project_arg $video_arg --retries=${{ inputs.e2e_retry_attempts }}
      
      # Upload Playwright artifacts
      - name: Upload Playwright report
        if: always() && inputs.run_playwright_tests
        uses: actions/upload-artifact@v4
        with:
          name: playwright-deployed-e2e-${{ github.run_number }}
          path: |
            **/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload Playwright screenshots
        if: failure() && inputs.run_playwright_tests
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-deployed-${{ github.run_number }}
          path: |
            **/test-results/**
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload Reqnroll artifacts
      - name: Upload Reqnroll test results
        if: always() && inputs.e2e_project != ''
        uses: actions/upload-artifact@v4
        with:
          name: reqnroll-results-deployed-${{ github.run_number }}
          path: TestResults/*.trx
          retention-days: 7
      
      - name: Upload Reqnroll screenshots
        if: failure() && inputs.e2e_project != ''
        uses: actions/upload-artifact@v4
        with:
          name: reqnroll-screenshots-deployed-${{ github.run_number }}
          path: |
            **/Screenshots/**
            **/screenshots/**
            **/e2e-screenshots/**
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload Reqnroll videos
        if: failure() && inputs.e2e_enable_video && inputs.e2e_project != ''
        uses: actions/upload-artifact@v4
        with:
          name: reqnroll-videos-deployed-${{ github.run_number }}
          path: |
            **/videos/**
            **/Videos/**
            **/e2e-videos/**
          if-no-files-found: ignore
          retention-days: 3
      
      # Test Summary
      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 E2E Test Results (Deployed Environment)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Web URL: \`${{ inputs.web_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔌 API URL: \`${{ inputs.api_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ inputs.e2e_project }}" ]; then
            echo "**Reqnroll Tests:**" >> $GITHUB_STEP_SUMMARY
            echo "- Filter: \`${{ inputs.test_filter || 'all tests' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Retry attempts: \`${{ inputs.e2e_retry_attempts }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ inputs.run_playwright_tests }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Playwright Tests:**" >> $GITHUB_STEP_SUMMARY
            echo "- Project: \`${{ inputs.playwright_project || 'all projects' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Retry attempts: \`${{ inputs.e2e_retry_attempts }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: \`${{ inputs.node_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- .NET: \`${{ inputs.dotnet_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Video recording: \`${{ inputs.e2e_enable_video }}\`" >> $GITHUB_STEP_SUMMARY
