name: Template - Deploy API (App Service)

on:
  workflow_call:
    inputs:
      shared_ref:
        description: 'Ref (tag/sha/branch) of aexionsolutions/azure-devops-workflows to checkout into ./shared. Set this to the same @ref used in the calling repo. If omitted, defaults to main.'
        required: false
        type: string
        default: ''
      environment:
        required: true
        type: string
      app-name:
        required: true
        type: string
      resource-group:
        required: false
        type: string
        default: ''
      artifact-name:
        required: false
        type: string
        default: ''
      package:
        required: false
        type: string
        default: ''
      warmup-url-staging:
        required: false
        type: string
        default: ''
      warmup-url-prod:
        required: false
        type: string
        default: ''
      expect-version:
        required: false
        type: string
        default: ''
      version-url:
        required: false
        type: string
        default: ''
      run-from-package:
        required: false
        type: string
        default: 'true'
      verify-base-url:
        required: false
        type: string
        default: ''
      require-preprod-parity:
        required: false
        type: string
        default: 'false'
      preprod-version-url:
        required: false
        type: string
        default: ''
      swagger-enabled:
        required: false
        type: string
        default: 'true'
      api-protected-path:
        required: false
        type: string
        default: '/api/ping'
      b2c-kv-url:
        required: false
        type: string
        default: ''
      b2c-kv-secret-name:
        required: false
        type: string
        default: ''
      b2c-smoke-client-id:
        required: false
        type: string
        default: ''
      b2c_authority:
        required: false
        type: string
        default: ''
      b2c_client_id:
        required: false
        type: string
        default: ''
      b2c_scope:
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_CREDENTIALS:
        required: false
      B2C_SMOKE_CLIENT_ID:
        required: false
      AAD_B2C_AUTHORITY:
        required: false
      AAD_B2C_API_SCOPE:
        required: false
      B2C_TEST_USER_EMAIL:
        required: false
      B2C_TEST_USER_PASSWORD:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CALLER_WORKDIR: caller
    outputs:
      use_slot: ${{ steps.resolve.outputs.use_slot }}
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.shared_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF="main"
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller (e.g., v4.1.0 or v4.1.0-pr.3.7b67a2d)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v4
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: shared

      - name: Azure login (smart)
        uses: ./shared/.github/actions/azure-login-smart
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifact (if provided)
        if: inputs['artifact-name'] != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs['artifact-name'] }}
          path: _pkg

      - name: Debug downloaded artifact
        if: inputs['artifact-name'] != ''
        shell: bash
        run: |
          echo "Contents of _pkg after download:"
          ls -lah _pkg/ || true
          find _pkg -type f -name "*.zip" -exec file {} \; || true
          find _pkg -type f -name "*.zip" -exec ls -lh {} \; || true

      - name: Resolve Resource Group (fallback if not provided)
        id: rgres
        if: inputs['resource-group'] == ''
        uses: ./shared/.github/actions/resolve-rg
        with:
          environment: ${{ inputs['environment'] }}
          default: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dev: ${{ secrets.AZURE_RG_DEV }}
          uat: ${{ secrets.AZURE_RG_UAT }}
          preprod: ${{ secrets.AZURE_RG_PREPROD }}
          prod: ${{ secrets.AZURE_RG_PROD }}
          verify-exists: 'true'
          fail-on-missing: 'true'

      - name: Resolve package path and slot support
        id: resolve
        shell: bash
        env:
          PKG_INPUT: ${{ inputs['package'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          USE_SLOT_INPUT: auto
          RFP_IN: ${{ inputs['run-from-package'] }}
          RG_INPUT: ${{ inputs['resource-group'] }}
          RG_FALLBACK: ${{ steps.rgres.outputs.resource-group }}
          APP: ${{ inputs['app-name'] }}
          ENVIRONMENT: ${{ inputs['environment'] }}
        run: |
          set -euo pipefail
          RG="${RG_INPUT:-}"
          if [ -z "$RG" ]; then RG="${RG_FALLBACK:-}"; fi
          if [ -z "${RG:-}" ]; then
            echo "Missing input: resource-group and fallback resolution failed. Ensure a valid Resource Group is available." >&2
            exit 1
          fi
          if [ -z "${APP:-}" ]; then
            echo "Missing input: app-name. Ensure the caller passes 'app-name' to the reusable workflow." >&2
            exit 1
          fi
          ART="$ARTIFACT_NAME"
          if [ -n "$ART" ]; then
            PKG=$(find _pkg -maxdepth 1 -type f -name "*.zip" | head -n1 || true)
            if [ -z "$PKG" ]; then
              echo "Artifact $ART did not contain a .zip file" >&2; exit 1
            fi
          else
            PKG="$PKG_INPUT"
          fi
          if [ -z "$PKG" ]; then
            echo "No package provided (inputs.package) and no artifact-name specified; one is required." >&2
            exit 1
          fi
          echo "package=$PKG" >> $GITHUB_OUTPUT

          USE="$USE_SLOT_INPUT"
          if [ "$USE" = "auto" ]; then
            PLAN_ID=$(az webapp show -g "$RG" -n "$APP" --query serverFarmId -o tsv 2>/dev/null || true)
            if [ -z "$PLAN_ID" ]; then
              echo "Could not determine App Service Plan for $APP in RG $RG; defaulting to no slot (use-slot=false)." >&2
              USE=false
            else
              TIER=$(az appservice plan show --ids "$PLAN_ID" --query sku.tier -o tsv 2>/dev/null || true)
              if [ -z "$TIER" ]; then
                echo "Could not read plan SKU tier; defaulting to no slot (use-slot=false)." >&2
                USE=false
              else
                case "$TIER" in
                  Standard|Premium|PremiumV2|PremiumV3|Isolated|IsolatedV2) USE=true;;
                  *) USE=false;;
                esac
              fi
            fi
          fi
          echo "use_slot=$USE" >> $GITHUB_OUTPUT

          RFP=$(echo "${RFP_IN:-false}" | tr '[:upper:]' '[:lower:]')
          case "$RFP" in
            true|false) : ;;
            *) RFP=false ;;
          esac
          echo "run_from_package=$RFP" >> $GITHUB_OUTPUT
          echo "rg=$RG" >> $GITHUB_OUTPUT

      - name: Configure WEBSITE_RUN_FROM_PACKAGE
        shell: bash
        env:
          RG: ${{ steps.resolve.outputs.rg }}
          APP: ${{ inputs['app-name'] }}
          USE: ${{ steps.resolve.outputs.use_slot }}
          RFP: ${{ steps.resolve.outputs.run_from_package }}
        run: |
          set -euo pipefail
          if [ "$RFP" = "true" ]; then
            if [ "$USE" = "true" ]; then
              az webapp config appsettings set -g "$RG" -n "$APP" --slot staging --settings WEBSITE_RUN_FROM_PACKAGE=1
            else
              az webapp config appsettings set -g "$RG" -n "$APP" --settings WEBSITE_RUN_FROM_PACKAGE=1
            fi
          else
            if [ "$USE" = "true" ]; then
              az webapp config appsettings delete -g "$RG" -n "$APP" --slot staging --setting-names WEBSITE_RUN_FROM_PACKAGE || true
            else
              az webapp config appsettings delete -g "$RG" -n "$APP" --setting-names WEBSITE_RUN_FROM_PACKAGE || true
            fi
          fi

      - name: Set BUILD_VERSION app setting
        if: inputs['expect-version'] != ''
        shell: bash
        env:
          RG: ${{ steps.resolve.outputs.rg }}
          APP: ${{ inputs['app-name'] }}
          VERSION: ${{ inputs['expect-version'] }}
          ENV: ${{ inputs['environment'] }}
          USE: ${{ steps.resolve.outputs.use_slot }}
        run: |
          set -euo pipefail
          echo "Setting BUILD_VERSION=$VERSION on $APP..."
          if [ "$USE" = "true" ]; then
            az webapp config appsettings set -g "$RG" -n "$APP" --slot staging --settings BUILD_VERSION="$VERSION" ENV="$ENV"
            az webapp config appsettings set -g "$RG" -n "$APP" --settings BUILD_VERSION="$VERSION" ENV="$ENV"
          else
            az webapp config appsettings set -g "$RG" -n "$APP" --settings BUILD_VERSION="$VERSION" ENV="$ENV"
          fi

      - name: Deploy via composite
        uses: ./shared/.github/actions/appservice-slot-deploy
        with:
          resource-group: ${{ steps.resolve.outputs.rg }}
          app-name: ${{ inputs['app-name'] }}
          package: ${{ steps.resolve.outputs.package }}
          use-slot: ${{ steps.resolve.outputs.use_slot }}
          warmup-url-staging: ${{ inputs['warmup-url-staging'] }}
          warmup-url-prod: ${{ inputs['warmup-url-prod'] }}
          skip-swap: 'true'
          expect-version: ${{ inputs['expect-version'] }}
          version-url: ${{ inputs['version-url'] }}

  parity-gate:
    name: Preprod parity gate
    runs-on: ubuntu-latest
    if: inputs.environment == 'prod' && inputs['require-preprod-parity'] == 'true'
    steps:
      - name: Check preprod version matches expected
        shell: bash
        env:
          EXPECT: ${{ inputs['expect-version'] }}
          URL: ${{ inputs['preprod-version-url'] }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECT:-}" ] || [ -z "${URL:-}" ]; then
            echo "Parity gate misconfigured: expect-version or preprod-version-url missing" >&2
            exit 1
          fi
          echo "Checking $URL contains version $EXPECT"
          BODY=$(curl -fsSL --max-time 20 "$URL" || true)
          if ! echo "$BODY" | grep -q "$EXPECT"; then
            echo "Preprod parity check failed: expected $EXPECT not found in response" >&2
            exit 1
          fi

  verify-api:
    name: Verify API Deployment
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CALLER_WORKDIR: caller
    outputs:
      base_url: ${{ steps.base.outputs.url }}
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.shared_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF="main"
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller (e.g., v4.1.0 or v4.1.0-pr.3.7b67a2d)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v4
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: shared

      - name: Azure login (smart)
        uses: ./shared/.github/actions/azure-login-smart
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure jq is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Decide base URL
        id: base
        shell: bash
        env:
          ENV: ${{ inputs.environment }}
          PROVIDED: ${{ inputs['verify-base-url'] }}
          USE_SLOT: ${{ needs.deploy-staging.outputs.use_slot }}
        run: |
          if [ -n "$PROVIDED" ]; then echo "url=$PROVIDED" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$USE_SLOT" = "true" ]; then
            echo "url=https://tems-${ENV}-api-staging.azurewebsites.net" >> $GITHUB_OUTPUT
          else
            echo "url=https://tems-${ENV}-api.azurewebsites.net" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Resource Group (verify)
        id: rgres
        if: inputs['resource-group'] == ''
        uses: ./shared/.github/actions/resolve-rg
        with:
          environment: ${{ inputs.environment }}
          default: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dev: ${{ secrets.AZURE_RG_DEV }}
          uat: ${{ secrets.AZURE_RG_UAT }}
          preprod: ${{ secrets.AZURE_RG_PREPROD }}
          prod: ${{ secrets.AZURE_RG_PROD }}
          verify-exists: 'true'
          fail-on-missing: 'true'

      - name: Read API auth settings (B2C)
        id: apisettings
        shell: bash
        env:
          RG_INPUT: ${{ inputs['resource-group'] }}
          RG_FALLBACK: ${{ steps.rgres.outputs.resource-group }}
          APP: ${{ inputs['app-name'] }}
          USE_SLOT: ${{ needs.deploy-staging.outputs.use_slot }}
        run: |
          set -euo pipefail
          RG="$RG_INPUT"; if [ -z "$RG" ]; then RG="$RG_FALLBACK"; fi
          if [ -z "$RG" ] || [ -z "${APP:-}" ]; then
            echo "Missing RG or app-name; cannot read app settings for token mint. Skipping settings read." >&2
            exit 0
          fi
          SLOT_ARGS=()
          if [ "$USE_SLOT" = "true" ]; then SLOT_ARGS=(--slot staging); fi
          JSON=$(az webapp config appsettings list -g "$RG" -n "$APP" ${SLOT_ARGS[@]} -o json || echo '[]')
          AUTH_B2C=$(echo "$JSON" | jq -r '.[] | select(.name=="Auth__B2C__Authority" or .name=="Auth:B2C:Authority") | .value' | head -n1)
          CLIENT_ID=$(echo "$JSON" | jq -r '.[] | select(.name=="Auth__ClientId" or .name=="Auth:ClientId") | .value' | head -n1)
          echo "b2c_authority=$AUTH_B2C" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Mint token for protected smoke (B2C ROPC for all environments)
        id: token
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.url }}
          AUTH_B2C_INPUT: ${{ inputs.b2c_authority }}
          AUTH_B2C_SECRET: ${{ secrets.AAD_B2C_AUTHORITY }}
          AUTH_B2C_APP: ${{ steps.apisettings.outputs.b2c_authority }}
          CLIENT_ID_INPUT: ${{ inputs.b2c_client_id }}
          CLIENT_ID_APP: ${{ steps.apisettings.outputs.client_id }}
          B2C_SCOPE_INPUT: ${{ inputs.b2c_scope }}
          B2C_SCOPE_SECRET: ${{ secrets.AAD_B2C_API_SCOPE }}
          SMOKE_CLIENT_ID: ${{ inputs.b2c-smoke-client-id || secrets.B2C_SMOKE_CLIENT_ID }}
          TEST_USER_EMAIL: ${{ secrets.B2C_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.B2C_TEST_USER_PASSWORD }}
          KV_URL: ${{ inputs['b2c-kv-url'] }}
          KV_SECRET_NAME: ${{ inputs['b2c-kv-secret-name'] }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "🔐 Using B2C ROPC (password grant) for token minting..."
          AUTH_B2C_FROM_INPUTS=no
          AUTH_B2C_FROM_SECRETS=no
          AUTH_B2C_FROM_APP=no
          if [ -n "${AUTH_B2C_INPUT:-}" ]; then
            AUTH_B2C="$AUTH_B2C_INPUT"
            AUTH_B2C_FROM_INPUTS=yes
          elif [ -n "${AUTH_B2C_SECRET:-}" ]; then
            AUTH_B2C="$AUTH_B2C_SECRET"
            AUTH_B2C_FROM_SECRETS=yes
          elif [ -n "${AUTH_B2C_APP:-}" ]; then
            AUTH_B2C="$AUTH_B2C_APP"
            AUTH_B2C_FROM_APP=yes
          else
            AUTH_B2C=""
          fi

          CLIENT_ID_FROM_INPUTS=no
          CLIENT_ID_FROM_APP=no
          if [ -n "${CLIENT_ID_INPUT:-}" ]; then
            CLIENT_ID_API="$CLIENT_ID_INPUT"
            CLIENT_ID_FROM_INPUTS=yes
          elif [ -n "${CLIENT_ID_APP:-}" ]; then
            CLIENT_ID_API="$CLIENT_ID_APP"
            CLIENT_ID_FROM_APP=yes
          else
            CLIENT_ID_API=""
          fi

          echo "AUTH_B2C from inputs: $AUTH_B2C_FROM_INPUTS"
          echo "AUTH_B2C from secrets: $AUTH_B2C_FROM_SECRETS"
          echo "AUTH_B2C fetched from app settings: $AUTH_B2C_FROM_APP"
          echo "CLIENT_ID from inputs: $CLIENT_ID_FROM_INPUTS"
          echo "CLIENT_ID fetched from app settings: $CLIENT_ID_FROM_APP"

          if [ -z "${AUTH_B2C:-}" ]; then
            echo "❌ ERROR: B2C authority is missing." >&2
            echo "Provide inputs.b2c_authority or secrets.AAD_B2C_AUTHORITY (legacy)." >&2
            echo "Optional fallback: configure Auth:B2C:Authority in API app settings." >&2
            exit 1
          fi
          if [ -z "${CLIENT_ID_API:-}" ]; then
            echo "❌ ERROR: API client ID is missing." >&2
            echo "Provide inputs.b2c_client_id or configure Auth:ClientId in API app settings." >&2
            exit 1
          fi
          if echo "$AUTH_B2C" | grep -q "ciamlogin.com"; then
            TENANT_ID=$(echo "$AUTH_B2C" | sed -n 's|.*/\([0-9a-f-]*\)/v2\.0|\1|p')
            TENANT_SUBDOMAIN=$(echo "$AUTH_B2C" | sed -n 's|https://\([^.]*\)\.ciamlogin\.com.*|\1|p')
            if [ -z "$TENANT_ID" ] || [ -z "$TENANT_SUBDOMAIN" ]; then
              echo "Could not extract tenant ID or subdomain from authority: $AUTH_B2C" >&2
              exit 1
            fi
            TOKEN_URL="https://${TENANT_SUBDOMAIN}.ciamlogin.com/${TENANT_ID}/oauth2/v2.0/token"
          elif echo "$AUTH_B2C" | grep -q "b2clogin.com"; then
            TENANT_SUBDOMAIN=$(echo "$AUTH_B2C" | sed -n 's|https://\([^.]*\)\.b2clogin\.com.*|\1|p')
            TENANT_DOMAIN=$(echo "$AUTH_B2C" | sed -n 's|https://[^/]*\/\([^/]*\)/.*|\1|p')
            POLICY=$(echo "$AUTH_B2C" | sed -n 's|https://[^/]*\/[^/]*\/\([^/]*\)/v2\.0|\1|p')
            if [ -z "$TENANT_SUBDOMAIN" ] || [ -z "$TENANT_DOMAIN" ]; then
              echo "Could not extract tenant subdomain or domain from authority: $AUTH_B2C" >&2
              exit 1
            fi
            if [ -n "${POLICY:-}" ]; then
              TOKEN_URL="https://${TENANT_SUBDOMAIN}.b2clogin.com/${TENANT_DOMAIN}/${POLICY}/oauth2/v2.0/token"
            else
              TOKEN_URL="https://${TENANT_SUBDOMAIN}.b2clogin.com/${TENANT_DOMAIN}/oauth2/v2.0/token"
            fi
          else
            echo "Unsupported authority host in AUTH_B2C: $AUTH_B2C" >&2
            exit 1
          fi

          SCOPE_FROM_INPUTS=no
          SCOPE_FROM_SECRETS=no
          if [ -n "${B2C_SCOPE_INPUT:-}" ]; then
            SCOPE="$B2C_SCOPE_INPUT"
            SCOPE_FROM_INPUTS=yes
          elif [ -n "${B2C_SCOPE_SECRET:-}" ]; then
            SCOPE="$B2C_SCOPE_SECRET"
            SCOPE_FROM_SECRETS=yes
          else
            echo "❌ ERROR: B2C scope is missing." >&2
            echo "Provide inputs.b2c_scope or secrets.AAD_B2C_API_SCOPE (e.g. 'api://<api-app-id>/Orders.ReadWrite')." >&2
            exit 1
          fi

          echo "SCOPE from inputs: $SCOPE_FROM_INPUTS"
          echo "SCOPE from secrets: $SCOPE_FROM_SECRETS"
          echo "Token host: $(echo "$TOKEN_URL" | sed 's|https://||' | cut -d/ -f1)"
          echo "Scope (first token): $(echo "$SCOPE" | awk '{print $1}')"

          if [[ "$SCOPE" != *"openid"* ]]; then SCOPE="$SCOPE openid"; fi
          if [[ "$SCOPE" != *"offline_access"* ]]; then SCOPE="$SCOPE offline_access"; fi
          if [ -z "$SMOKE_CLIENT_ID" ]; then
            echo "❌ ERROR: B2C_SMOKE_CLIENT_ID secret is required for ROPC authentication." >&2
            exit 1
          fi
          ROPC_CLIENT_ID="$SMOKE_CLIENT_ID"
          USER_EMAIL="$TEST_USER_EMAIL"
          USER_PASSWORD="$TEST_USER_PASSWORD"
          if [ -z "$USER_PASSWORD" ] && [ -n "${KV_URL:-}" ] && [ -n "${KV_SECRET_NAME:-}" ]; then
            echo "Attempting to fetch password from Key Vault..."
            USER_PASSWORD=$(az keyvault secret show --vault-url "$KV_URL" -n "$KV_SECRET_NAME" --query value -o tsv 2>/dev/null || true)
          fi
          if [ -z "$USER_EMAIL" ] || [ -z "$USER_PASSWORD" ]; then
            echo "❌ ERROR: Test user credentials required for B2C ROPC authentication." >&2
            exit 1
          fi
          echo "Minting B2C token via ROPC (password grant) against $TOKEN_URL"
          ATTEMPTS=5
          SLEEP=2
          ACCESS_TOKEN=""
          for i in $(seq 1 $ATTEMPTS); do
            RESP=$(curl -sS -X POST \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password" \
              -d "client_id=${ROPC_CLIENT_ID}" \
              -d "username=${USER_EMAIL}" \
              -d "password=${USER_PASSWORD}" \
              --data-urlencode "scope=${SCOPE}" \
              "$TOKEN_URL" || true)
            ACCESS_TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
            if [ -n "$ACCESS_TOKEN" ]; then
              break
            fi
            echo "Token mint attempt $i failed; retrying in ${SLEEP}s..." >&2
            sleep "$SLEEP"
            if [ $SLEEP -lt 16 ]; then SLEEP=$((SLEEP*2)); fi
          done
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to mint access token after $ATTEMPTS attempts. Last response:" >&2
            echo "$RESP" >&2
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "B2C_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Protected smoke token claims (debug)
        if: env.B2C_ACCESS_TOKEN != ''
        shell: bash
        env:
          ACCESS_TOKEN: ${{ env.B2C_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_TOKEN:-}" ]; then
            echo "No token present to decode claims." >&2
            exit 1
          fi
          part2=$(echo "$ACCESS_TOKEN" | cut -d '.' -f2)
          rem=$(( ${#part2} % 4 ))
          if [ $rem -eq 2 ]; then part2+="=="; elif [ $rem -eq 3 ]; then part2+="="; fi
          json=$(echo "$part2" | tr '-_' '+/' | base64 -d 2>/dev/null || echo "{}")
          subset=$(echo "$json" | jq '{iss, aud, scp, roles, tfp, tid, azp, appid, sub, iat, nbf, exp} | with_entries(select(.value != null))')
          {
            echo "### Protected smoke token claims"
            echo '```json'
            echo "$subset"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: API health checks
        shell: bash
        run: |
          set -x
          curl -sS -i "${{ steps.base.outputs.url }}/healthz" || true
          curl -sS     "${{ steps.base.outputs.url }}/_meta" || true

      - name: API swagger smoke
        shell: bash
        env:
          SWAGGER_ENABLED: ${{ inputs['swagger-enabled'] }}
        run: |
          set -euo pipefail
          if [ "${SWAGGER_ENABLED,,}" != "true" ]; then
            echo "Swagger smoke skipped (SWAGGER_ENABLED!=true)"
            exit 0
          fi
          echo "Checking Swagger UI endpoint..."
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.base.outputs.url }}/swagger/index.html" || true)
          echo "HTTP $code from /swagger/index.html"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "Swagger UI not reachable (HTTP $code). If expected in this env, set SWAGGER_ENABLED=false at env/Org level." >&2
            exit 1
          fi

      - name: API protected smoke (auto)
        shell: bash
        env:
          TOKEN: ${{ env.B2C_ACCESS_TOKEN }}
          PATH_ONLY: ${{ inputs['api-protected-path'] }}
          BASE: ${{ steps.base.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "API protected smoke cannot proceed: no token minted. Configure B2C_TEST_USER_EMAIL/PASSWORD secrets." >&2
            exit 1
          fi
          URL="${BASE%/}${PATH_ONLY}"
          echo "Protected smoke: GET $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$URL" || true)
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "First attempt HTTP $code; retrying in 3s..."
            sleep 3
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$URL" || true)
          fi
          echo "HTTP $code from protected endpoint"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Protected API smoke failed (HTTP $code)." >&2
            exit 1
          fi

  route-traffic:
    name: Deploy to Production
    needs: [deploy-staging, verify-api, parity-gate]
    if: |
      always() &&
      (needs.verify-api.result == 'success') &&
      (inputs.environment != 'prod' || inputs['require-preprod-parity'] != 'true' || needs.parity-gate.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CALLER_WORKDIR: caller
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.shared_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF="main"
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller (e.g., v4.1.0 or v4.1.0-pr.3.7b67a2d)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v4
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: shared

      - name: Azure login (smart)
        uses: ./shared/.github/actions/azure-login-smart
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifact (if provided)
        if: inputs['artifact-name'] != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs['artifact-name'] }}
          path: _pkg

      - name: Resolve Resource Group (fallback if not provided)
        id: rgres
        if: inputs['resource-group'] == ''
        uses: ./shared/.github/actions/resolve-rg
        with:
          environment: ${{ inputs['environment'] }}
          default: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dev: ${{ secrets.AZURE_RG_DEV }}
          uat: ${{ secrets.AZURE_RG_UAT }}
          preprod: ${{ secrets.AZURE_RG_PREPROD }}
          prod: ${{ secrets.AZURE_RG_PROD }}
          verify-exists: 'true'
          fail-on-missing: 'true'

      - name: Resolve package path and slot support
        id: resolve
        shell: bash
        env:
          PKG_INPUT: ${{ inputs['package'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          USE_SLOT_INPUT: ${{ needs.deploy-staging.outputs.use_slot }}
          RFP_IN: ${{ inputs['run-from-package'] }}
          RG_INPUT: ${{ inputs['resource-group'] }}
          RG_FALLBACK: ${{ steps.rgres.outputs.resource-group }}
          APP: ${{ inputs['app-name'] }}
          ENVIRONMENT: ${{ inputs['environment'] }}
        run: |
          set -euo pipefail
          RG="${RG_INPUT:-}"
          if [ -z "$RG" ]; then RG="${RG_FALLBACK:-}"; fi
          if [ -z "${RG:-}" ]; then
            echo "Missing input: resource-group and fallback resolution failed. Ensure a valid Resource Group is available." >&2
            exit 1
          fi
          if [ -z "${APP:-}" ]; then
            echo "Missing input: app-name. Ensure the caller passes 'app-name' to the reusable workflow." >&2
            exit 1
          fi
          ART="$ARTIFACT_NAME"
          if [ -n "$ART" ]; then
            PKG=$(find _pkg -maxdepth 1 -type f -name "*.zip" | head -n1 || true)
            if [ -z "$PKG" ]; then
              echo "Artifact $ART did not contain a .zip file" >&2; exit 1
            fi
          else
            PKG="$PKG_INPUT"
          fi
          if [ -z "$PKG" ]; then
            echo "No package provided (inputs.package) and no artifact-name specified; one is required." >&2
            exit 1
          fi
          echo "package=$PKG" >> $GITHUB_OUTPUT

          USE="$USE_SLOT_INPUT"
          echo "use_slot=$USE" >> $GITHUB_OUTPUT

          RFP=$(echo "${RFP_IN:-false}" | tr '[:upper:]' '[:lower:]')
          case "$RFP" in
            true|false) : ;;
            *) RFP=false ;;
          esac
          echo "run_from_package=$RFP" >> $GITHUB_OUTPUT
          echo "rg=$RG" >> $GITHUB_OUTPUT

      - name: Configure WEBSITE_RUN_FROM_PACKAGE
        shell: bash
        env:
          RG: ${{ steps.resolve.outputs.rg }}
          APP: ${{ inputs['app-name'] }}
          USE: ${{ steps.resolve.outputs.use_slot }}
          RFP: ${{ steps.resolve.outputs.run_from_package }}
        run: |
          set -euo pipefail
          if [ "$RFP" = "true" ]; then
            if [ "$USE" = "true" ]; then
              az webapp config appsettings set -g "$RG" -n "$APP" --slot staging --settings WEBSITE_RUN_FROM_PACKAGE=1
            else
              az webapp config appsettings set -g "$RG" -n "$APP" --settings WEBSITE_RUN_FROM_PACKAGE=1
            fi
          else
            if [ "$USE" = "true" ]; then
              az webapp config appsettings delete -g "$RG" -n "$APP" --slot staging --setting-names WEBSITE_RUN_FROM_PACKAGE || true
            else
              az webapp config appsettings delete -g "$RG" -n "$APP" --setting-names WEBSITE_RUN_FROM_PACKAGE || true
            fi
          fi

      - name: Set BUILD_VERSION app setting
        if: inputs['expect-version'] != ''
        shell: bash
        env:
          RG: ${{ steps.resolve.outputs.rg }}
          APP: ${{ inputs['app-name'] }}
          VERSION: ${{ inputs['expect-version'] }}
          ENV: ${{ inputs['environment'] }}
          USE: ${{ steps.resolve.outputs.use_slot }}
        run: |
          set -euo pipefail
          echo "Setting BUILD_VERSION=$VERSION on $APP..."
          if [ "$USE" = "true" ]; then
            az webapp config appsettings set -g "$RG" -n "$APP" --slot staging --settings BUILD_VERSION="$VERSION" ENV="$ENV"
            az webapp config appsettings set -g "$RG" -n "$APP" --settings BUILD_VERSION="$VERSION" ENV="$ENV"
          else
            az webapp config appsettings set -g "$RG" -n "$APP" --settings BUILD_VERSION="$VERSION" ENV="$ENV"
          fi

      - name: Swap slots + warmup production
        uses: ./shared/.github/actions/appservice-slot-deploy
        with:
          resource-group: ${{ steps.resolve.outputs.rg }}
          app-name: ${{ inputs['app-name'] }}
          package: ${{ steps.resolve.outputs.package }}
          use-slot: ${{ steps.resolve.outputs.use_slot }}
          warmup-url-staging: ${{ inputs['warmup-url-staging'] }}
          warmup-url-prod: ${{ inputs['warmup-url-prod'] }}
          skip-deploy: 'true'
          expect-version: ${{ inputs['expect-version'] }}
          version-url: ${{ inputs['version-url'] }}

  verify-summary:
    name: Verify Failure Summary
    needs: [verify-api]
    if: always() && (needs.verify-api.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Write verify failure summary
        shell: bash
        env:
          URL_API: ${{ needs.verify-api.outputs.base_url }}
        run: |
          {
            echo "## ❌ Verification Failed"
            echo ""
            echo "**API URL:** $URL_API"
            echo ""
            echo "See step logs above for details."
          } >> "$GITHUB_STEP_SUMMARY"
