name: Reusable Web E2E CI (parallel suites)

# Full-stack E2E (database, API, web) with a separate job per suite: Reqnroll in one, Playwright in one per shard
# (playwright_shards), each with its own database, API and web. For every suite in a single job, call web-e2e-ci.yml.

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (tag/sha/branch) to test. Required for promote-release to ensure tests match the build version.'
        required: false
        type: string
      shared_ref:
        description: 'Ref (tag/sha/branch) of aexionsolutions/azure-devops-workflows to checkout into ./shared. Set this to the same @ref used in the calling repo. If omitted, defaults to main.'
        required: false
        type: string
        default: ''
      repo_preset:
        description: 'Auto-configure ports and database for known repos (tems, ravenxpress). Overrides api_port, web_port, and postgres_db if set. NOTE: database_port CANNOT be set by preset (GitHub Actions limitation - services start before steps run), so TEMS must explicitly pass database_port: 5434.'
        required: false
        type: string
        default: ''
      solution:
        description: 'Path to .sln file for building the API (e.g., RavenXpress.sln, Ems.sln)'
        required: true
        type: string
      api_project:
        description: 'Path to API .csproj file (e.g., rx-platform/src/RavenXpress.Api/RavenXpress.Api.csproj)'
        required: true
        type: string
      web_directory:
        description: 'Path to web project directory (e.g., rx-web, web/tems-portal)'
        required: true
        type: string
      e2e_project:
        description: 'Path to E2E test .csproj file with Reqnroll/SpecFlow (e.g., tests/RavenXpress.E2E/RavenXpress.E2E.csproj). Leave empty to skip Reqnroll tests.'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      run_smoke_only:
        description: 'Run only smoke tests (faster for PR), or all tests'
        required: false
        type: boolean
        default: true
      test_filter:
        description: 'Test filter for Reqnroll tests (e.g., @smoke, @regression, @critical). Ignored if run_smoke_only is true.'
        required: false
        type: string
        default: ''
      e2e_retry_attempts:
        description: 'Total attempts for E2E tests (1 disables retries, useful for flaky tests)'
        required: false
        type: number
        default: 1
      e2e_enable_video:
        description: 'Capture E2E Playwright video recordings (increases artifact size)'
        required: false
        type: boolean
        default: false
      console_verbosity:
        description: 'Console logger verbosity for dotnet test (quiet, minimal, normal, detailed, diagnostic)'
        required: false
        type: string
        default: 'normal'
      postgres_db:
        description: 'PostgreSQL database name'
        required: false
        type: string
        default: 'e2e_test'
      postgres_user:
        description: 'PostgreSQL username'
        required: false
        type: string
        default: 'postgres'
      postgres_password:
        description: 'PostgreSQL password (defaults to test_password_e2e_123)'
        required: false
        type: string
        default: 'test_password_e2e_123'
      database_port:
        description: 'PostgreSQL port (must not conflict with other tests)'
        required: false
        type: number
        default: 5432
      api_port:
        description: 'Port for API server (must not conflict with other tests)'
        required: false
        type: number
        default: 5100
      web_port:
        description: 'Port for web server (must not conflict with other tests)'
        required: false
        type: number
        default: 3100
      enable_azurite:
        description: 'Enable Azurite blob storage emulator (required if API uses Azure Blob Storage)'
        required: false
        type: boolean
        default: true
      seed_data_script:
        description: 'Path to SQL file with seed data (relative to repo root). Leave empty to skip seeding.'
        required: false
        type: string
        default: ''
      run_playwright_tests:
        description: 'Run Playwright tests from web_directory (in addition to Reqnroll tests)'
        required: false
        type: boolean
        default: true
      playwright_smoke_config:
        description: 'Path to Playwright smoke config file relative to web_directory (e.g., playwright.smoke.config.ts). Required when run_smoke_only is true and run_playwright_tests is true.'
        required: false
        type: string
        default: ''
      playwright_shards:
        description: 'Split Playwright across this many parallel jobs (npx playwright test --shard=i/N), 1-8.'
        required: false
        type: number
        default: 1
      playwright_max_failures:
        description: 'Stop a Playwright run once this many tests are still failing after their retries (npx playwright test --max-failures). A test counts only when it has no retries left, so with 2 retries a limit of 10 allows about 30 failed runs, and tests already running finish. Applies per Playwright job, so per shard. 0 disables the limit. A broken build otherwise runs every test to its timeout on every retry.'
        required: false
        type: number
        default: 10
      job_timeout_minutes:
        description: 'Timeout for each E2E job (each leg). Normal legs take about 10 minutes; a hung job otherwise runs for GitHub''s 6-hour default.'
        required: false
        type: number
        default: 45
      
      # Generic E2E environment variables (pass any test-specific env vars as JSON)
      e2e_env_vars:
        description: 'Additional E2E environment variables as JSON string (e.g., {"E2E_ADMIN_EMAIL":"admin@test.com", "CUSTOM_VAR":"value"}). Secrets should be passed via e2e_secrets.'
        required: false
        type: string
        default: '{}'
      
      # B2C Configuration (non-sensitive, passed as inputs)
      b2c_authority:
        description: 'Azure B2C authority URL (e.g., https://yourtenantname.b2clogin.com/yourtenantname.onmicrosoft.com/B2C_1A_SIGNUP_SIGNIN)'
        required: false
        type: string
        default: ''
      b2c_client_id:
        description: 'Azure B2C client ID for E2E tests'
        required: false
        type: string
        default: ''
      b2c_scope:
        description: 'Azure B2C API scope (e.g., https://yourtenantname.onmicrosoft.com/api/access_as_user)'
        required: false
        type: string
        default: ''

      # Microsoft Graph provisioning (non-sensitive ids; the client secret is
      # passed via secrets.graph_client_secret). When all of graph_client_id +
      # secrets.graph_client_secret + b2c_tenant_id are supplied, the API can
      # mint invited B2C identities (signup approval / user invite) and the E2E
      # cleanup hook can delete exactly those afterward.
      graph_client_id:
        description: 'Client (application) id of the Graph provisioning app registration that mints invited B2C identities.'
        required: false
        type: string
        default: ''
      api_app_id:
        description: 'Client id of the API app registration (target service principal for App Role assignment on invited users).'
        required: false
        type: string
        default: ''
      extension_app_id:
        description: 'App id owning the B2C custom extension attributes (optional; only needed if invited users carry the role extension attribute).'
        required: false
        type: string
        default: ''
      b2c_tenant_id:
        description: 'Directory (tenant) id of the B2C / Entra External ID tenant where identities are provisioned.'
        required: false
        type: string
        default: ''
      graph_tenant_domain:
        description: 'Primary domain of the B2C tenant (e.g. yourtenant.onmicrosoft.com), used to build invited user UPNs.'
        required: false
        type: string
        default: ''

    secrets:
      E2E_JWT_SIGNING_KEY:
        description: 'JWT signing key for E2E authentication (generated if not provided)'
        required: false
      E2E_JWT_AUDIENCE:
        description: 'JWT audience for E2E tests (defaults to e2e-api if not provided)'
        required: false
      # B2C client secret (sensitive)
      b2c_client_secret:
        description: 'Azure B2C client secret for E2E test user ROPC flow'
        required: false
      # Microsoft Graph provisioning client secret (sensitive)
      graph_client_secret:
        description: 'Client secret of the Graph provisioning app registration (used by the API to mint invited B2C identities and by the E2E cleanup to delete them).'
        required: false
      # Server-only Google Maps Platform credential. Keep this separate from
      # browser/referrer-restricted Maps keys and scope it to the API process.
      google_maps_platform_server_api_key:
        description: 'Server-restricted Google Maps Platform API key. When provided, the API starts with GoogleMapsPlatform enabled.'
        required: false
      # Generic secret passthrough for test-specific secrets (personas, API keys, etc.)
      e2e_secrets:
        description: 'Additional E2E secrets as JSON string (e.g., {"E2E_ADMIN_USER_EMAIL":"admin@test.com", "E2E_ADMIN_USER_PASSWORD":"secret123"}). These will be masked in logs.'
        required: false
      # Legacy B2C secrets (for backwards compatibility)
      AAD_B2C_AUTHORITY:
        description: 'Legacy: Azure B2C authority URL (prefer inputs.b2c_authority)'
        required: false
      B2C_SMOKE_CLIENT_ID:
        description: 'Legacy: Azure B2C client ID (prefer inputs.b2c_client_id)'
        required: false
      AAD_B2C_API_SCOPE:
        description: 'Legacy: Azure B2C API scope (prefer inputs.b2c_scope)'
        required: false
      B2C_SMOKE_CLIENT_SECRET:
        description: 'Legacy: Azure B2C client secret (prefer secrets.b2c_client_secret)'
        required: false
      # Postgres password (optional secret alternative to plaintext input)
      POSTGRES_PASSWORD:
        description: 'PostgreSQL password (prefer over plaintext inputs.postgres_password)'
        required: false

env:
  CALLER_WORKDIR: caller
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' && secrets.POSTGRES_PASSWORD || inputs.postgres_password }}

jobs:
  # Build API once, reuse in E2E job
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ${{ inputs.solution }}

      - name: Build API project
        run: |
          dotnet build ${{ inputs.api_project }} \
            -c Release \
            --no-restore \
            --nologo

      - name: Publish API
        run: |
          dotnet publish ${{ inputs.api_project }} \
            -c Release \
            -o ./api-publish \
            --no-build \
            --nologo

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-e2e-${{ github.run_id }}
          path: ./api-publish
          retention-days: 1

  # Plans the Playwright shard jobs (and whether a Reqnroll job runs). Every planned job has its own database, API and
  # web, so suites and shards never share data.
  plan-e2e:
    name: Plan E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_reqnroll: ${{ steps.plan.outputs.run_reqnroll }}
      playwright_legs: ${{ steps.plan.outputs.playwright_legs }}
    steps:
      - name: Plan E2E jobs
        id: plan
        shell: bash
        env:
          SHARDS: ${{ inputs.playwright_shards }}
          HAS_REQNROLL: ${{ inputs.e2e_project != '' }}
          HAS_PLAYWRIGHT: ${{ inputs.run_playwright_tests }}
        run: |
          set -euo pipefail
          if ! [[ "$SHARDS" =~ ^[1-8]$ ]]; then
            echo "::error::playwright_shards must be between 1 and 8 (got '$SHARDS')."
            exit 1
          fi
          LEGS='[]'
          if [ "$HAS_PLAYWRIGHT" = "true" ]; then
            for i in $(seq 1 "$SHARDS"); do
              if [ "$SHARDS" -gt 1 ]; then NAME="playwright-$i-of-$SHARDS"; SHARD="$i/$SHARDS"; else NAME="playwright"; SHARD=""; fi
              LEGS=$(jq -c --arg n "$NAME" --arg s "$SHARD" '. + [{"leg":$n,"shard":$s,"suffix":("-" + $n)}]' <<< "$LEGS")
            done
          fi
          if [ "$HAS_REQNROLL" != "true" ] && [ "$LEGS" = "[]" ]; then
            echo "::error::Nothing to run: set e2e_project (Reqnroll) and/or run_playwright_tests (Playwright)."
            exit 1
          fi
          {
            echo "run_reqnroll=$HAS_REQNROLL"
            echo "playwright_legs=$LEGS"
          } >> "$GITHUB_OUTPUT"
          echo "Reqnroll job: $HAS_REQNROLL; Playwright jobs: $LEGS"

  # The suite jobs below share their setup (e2e-start-stack), suite runners (e2e-run-reqnroll, e2e-run-playwright) and
  # teardown (e2e-stop-stack) with web-e2e-ci.yml as composite actions in this repository.

  # The Reqnroll suite in its own job.
  e2e-reqnroll:
    name: E2E Tests (reqnroll)
    if: needs.plan-e2e.outputs.run_reqnroll == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    needs: [build-api, plan-e2e]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ inputs.postgres_db }}
        ports:
          - ${{ inputs.database_port || 5432 }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        env:
          INPUT_REF: ${{ inputs.shared_ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-main}"
          if [ -z "$INPUT_REF" ]; then
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v7
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: shared

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup .NET (for running API and E2E tests)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-e2e-${{ github.run_id }}
          path: caller/api-publish

      - name: Start the stack (database, API, web)
        id: stack
        uses: ./shared/.github/actions/e2e-start-stack
        with:
          repo_preset: ${{ inputs.repo_preset }}
          database_port: ${{ inputs.database_port }}
          api_port: ${{ inputs.api_port }}
          web_port: ${{ inputs.web_port }}
          postgres_user: ${{ inputs.postgres_user }}
          postgres_db: ${{ inputs.postgres_db }}
          postgres_password_input: ${{ inputs.postgres_password }}
          postgres_password_secret: ${{ secrets.POSTGRES_PASSWORD }}
          e2e_jwt_signing_key: ${{ secrets.E2E_JWT_SIGNING_KEY }}
          e2e_jwt_audience: ${{ secrets.E2E_JWT_AUDIENCE }}
          enable_azurite: ${{ inputs.enable_azurite }}
          e2e_env_vars: ${{ inputs.e2e_env_vars }}
          e2e_secrets: ${{ secrets.e2e_secrets }}
          graph_client_id: ${{ inputs.graph_client_id }}
          graph_client_secret: ${{ secrets.graph_client_secret }}
          api_app_id: ${{ inputs.api_app_id }}
          extension_app_id: ${{ inputs.extension_app_id }}
          b2c_tenant_id: ${{ inputs.b2c_tenant_id }}
          graph_tenant_domain: ${{ inputs.graph_tenant_domain }}
          google_maps_platform_server_api_key: ${{ secrets.google_maps_platform_server_api_key }}
          api_project: ${{ inputs.api_project }}
          seed_data_script: ${{ inputs.seed_data_script }}
          web_directory: ${{ inputs.web_directory }}

      - name: Run Reqnroll E2E tests
        uses: ./shared/.github/actions/e2e-run-reqnroll
        with:
          e2e_project: ${{ inputs.e2e_project }}
          run_smoke_only: ${{ inputs.run_smoke_only }}
          test_filter: ${{ inputs.test_filter }}
          retry_attempts: ${{ inputs.e2e_retry_attempts }}
          console_verbosity: ${{ inputs.console_verbosity }}
          enable_video: ${{ inputs.e2e_enable_video }}
          database_port: ${{ steps.stack.outputs.database_port }}
          api_port: ${{ steps.stack.outputs.api_port }}
          web_port: ${{ steps.stack.outputs.web_port }}
          postgres_user: ${{ inputs.postgres_user }}
          postgres_db: ${{ inputs.postgres_db }}
          jwt_signing_key: ${{ steps.stack.outputs.jwt_signing_key }}
          jwt_issuer: ${{ steps.stack.outputs.jwt_issuer }}
          jwt_audience: ${{ steps.stack.outputs.jwt_audience }}
          b2c_authority: ${{ inputs.b2c_authority != '' && inputs.b2c_authority || secrets.AAD_B2C_AUTHORITY }}
          b2c_client_id: ${{ inputs.b2c_client_id != '' && inputs.b2c_client_id || secrets.B2C_SMOKE_CLIENT_ID }}
          b2c_scope: ${{ inputs.b2c_scope != '' && inputs.b2c_scope || secrets.AAD_B2C_API_SCOPE }}
          b2c_client_secret: ${{ secrets.b2c_client_secret != '' && secrets.b2c_client_secret || secrets.B2C_SMOKE_CLIENT_SECRET }}
          artifact_suffix: -reqnroll

      - name: Stop the stack
        if: always()
        uses: ./shared/.github/actions/e2e-stop-stack
        with:
          job_status: ${{ job.status }}
          api_port: ${{ steps.stack.outputs.api_port }}
          web_port: ${{ steps.stack.outputs.web_port }}
          artifact_suffix: -reqnroll
          suite: Reqnroll
          repo_preset: ${{ inputs.repo_preset }}
          run_smoke_only: ${{ inputs.run_smoke_only }}
          test_filter: ${{ inputs.test_filter }}
          ran_reqnroll: 'true'
          enable_video: ${{ inputs.e2e_enable_video }}

  # The Playwright suite in its own job, one per shard.
  e2e-playwright:
    name: E2E Tests (${{ matrix.leg }})
    if: needs.plan-e2e.outputs.playwright_legs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    needs: [build-api, plan-e2e]
    strategy:
      # Let every shard finish so one failing shard does not hide another's failures.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-e2e.outputs.playwright_legs) }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ inputs.postgres_db }}
        ports:
          - ${{ inputs.database_port || 5432 }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        env:
          INPUT_REF: ${{ inputs.shared_ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-main}"
          if [ -z "$INPUT_REF" ]; then
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v7
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          path: shared

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup .NET (for running the API)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-e2e-${{ github.run_id }}
          path: caller/api-publish

      - name: Start the stack (database, API, web)
        id: stack
        uses: ./shared/.github/actions/e2e-start-stack
        with:
          repo_preset: ${{ inputs.repo_preset }}
          database_port: ${{ inputs.database_port }}
          api_port: ${{ inputs.api_port }}
          web_port: ${{ inputs.web_port }}
          postgres_user: ${{ inputs.postgres_user }}
          postgres_db: ${{ inputs.postgres_db }}
          postgres_password_input: ${{ inputs.postgres_password }}
          postgres_password_secret: ${{ secrets.POSTGRES_PASSWORD }}
          e2e_jwt_signing_key: ${{ secrets.E2E_JWT_SIGNING_KEY }}
          e2e_jwt_audience: ${{ secrets.E2E_JWT_AUDIENCE }}
          enable_azurite: ${{ inputs.enable_azurite }}
          e2e_env_vars: ${{ inputs.e2e_env_vars }}
          e2e_secrets: ${{ secrets.e2e_secrets }}
          graph_client_id: ${{ inputs.graph_client_id }}
          graph_client_secret: ${{ secrets.graph_client_secret }}
          api_app_id: ${{ inputs.api_app_id }}
          extension_app_id: ${{ inputs.extension_app_id }}
          b2c_tenant_id: ${{ inputs.b2c_tenant_id }}
          graph_tenant_domain: ${{ inputs.graph_tenant_domain }}
          google_maps_platform_server_api_key: ${{ secrets.google_maps_platform_server_api_key }}
          api_project: ${{ inputs.api_project }}
          seed_data_script: ${{ inputs.seed_data_script }}
          web_directory: ${{ inputs.web_directory }}

      - name: Run Playwright tests
        uses: ./shared/.github/actions/e2e-run-playwright
        with:
          web_directory: ${{ inputs.web_directory }}
          web_port: ${{ steps.stack.outputs.web_port }}
          shard: ${{ matrix.shard }}
          max_failures: ${{ inputs.playwright_max_failures }}
          run_smoke_only: ${{ inputs.run_smoke_only }}
          smoke_config: ${{ inputs.playwright_smoke_config }}
          b2c_authority: ${{ inputs.b2c_authority != '' && inputs.b2c_authority || secrets.AAD_B2C_AUTHORITY }}
          b2c_client_id: ${{ inputs.b2c_client_id != '' && inputs.b2c_client_id || secrets.B2C_SMOKE_CLIENT_ID }}
          b2c_scope: ${{ inputs.b2c_scope != '' && inputs.b2c_scope || secrets.AAD_B2C_API_SCOPE }}
          b2c_client_secret: ${{ secrets.b2c_client_secret != '' && secrets.b2c_client_secret || secrets.B2C_SMOKE_CLIENT_SECRET }}
          artifact_suffix: ${{ matrix.suffix }}

      - name: Stop the stack
        if: always()
        uses: ./shared/.github/actions/e2e-stop-stack
        with:
          job_status: ${{ job.status }}
          api_port: ${{ steps.stack.outputs.api_port }}
          web_port: ${{ steps.stack.outputs.web_port }}
          artifact_suffix: ${{ matrix.suffix }}
          suite: ${{ matrix.shard != '' && format('Playwright (shard {0})', matrix.shard) || 'Playwright' }}
          repo_preset: ${{ inputs.repo_preset }}
          run_smoke_only: ${{ inputs.run_smoke_only }}
          ran_playwright: 'true'
          web_directory: ${{ inputs.web_directory }}
