name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      shared_ref:
        description: 'Ref (tag/sha/branch) of aexionsolutions/azure-devops-workflows to checkout into ./shared. Set this to the same @ref used in the calling repo. If omitted, defaults to main.'
        required: false
        type: string
        default: ''
      git_ref:
        description: 'Git ref (tag/sha/branch) to test. Required for promote-release to ensure tests match the build version.'
        required: false
        type: string
      solution:
        required: true
        type: string
      coverage_threshold:
        required: false
        type: number
        default: 80
      run_integration:
        required: false
        type: boolean
        default: false
      sonar_enabled:
        required: false
        type: boolean
        default: true
      pr_number:
        required: false
        type: string
        default: ''
      pr_head:
        required: false
        type: string
        default: ''
      pr_base:
        required: false
        type: string
        default: ''
      web_working_directory:
        required: false
        type: string
        description: 'Working directory for web unit tests (vitest)'
        default: 'web'
      run_web_unit_tests:
        required: false
        type: boolean
        description: 'Run web unit tests with vitest (skip if repo does not have vitest yet)'
        default: false
      js_lcov_path:
        required: true
        type: string
        description: 'Path to JS/TS lcov.info file for SonarCloud (e.g., web/tems-portal/coverage/lcov.info, rx-web/coverage/lcov.info)'
      sonar_exclusions:
        required: true
        type: string
        description: 'SonarCloud file exclusions (comma-separated patterns, e.g., **/bin/**,**/obj/**,**/node_modules/**,**/.next/**,**/coverage/**,**/.github/workflows/**,**/Program.cs)'
      sonar_coverage_exclusions:
        required: true
        type: string
        description: 'SonarCloud coverage exclusions (comma-separated patterns for config files like *.config.ts,*.config.js,**/tests/**,**/*.d.ts,**/*.css)'
      sonar_infra_exclusions:
        required: false
        type: string
        description: 'Infrastructure-specific exclusions (e.g., infra/tems-infra/azure/modules/**/*.bicep, docs/tools/**)'
        default: ''
      enforce_coverage:
        required: false
        type: boolean
        description: 'Enforce coverage thresholds. Set to false for time-travel testing (e.g., promote-release) where coverage was already validated.'
        default: true
      unit_test_project:
        required: false
        type: string
        description: 'Path to unit test project (e.g., tests/RavenXpress.UnitTests/RavenXpress.UnitTests.csproj). Auto-detected if omitted: finds first *UnitTest* or *Unit.Test* csproj under tests/.'
        default: ''
      integration_test_project:
        required: false
        type: string
        description: 'Path to integration test project (e.g., tests/RavenXpress.IntegrationTests/RavenXpress.IntegrationTests.csproj). Auto-detected if omitted: finds first *IntegrationTest* csproj under tests/.'
        default: ''
      postgres_db:
        required: false
        type: string
        description: 'PostgreSQL database name for integration tests (default: ci_test)'
        default: 'ci_test'
      coverage_assembly_filters:
        required: false
        type: string
        description: 'Assembly filters for code coverage (e.g., -MyApp.Tests;-MyApp.Infrastructure). Test assemblies are automatically excluded.'
        default: ''
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_ORG:
        required: false
      SONAR_PROJECT_KEY:
        required: false

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CALLER_WORKDIR: caller

    defaults:
      run:
        working-directory: caller
    
    steps:
      - name: Resolve shared workflows ref
        id: wfref
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.shared_ref }}"
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF="main"
            echo "### ⚠️ shared_ref not provided" >> "$GITHUB_STEP_SUMMARY"
            echo "Defaulting shared checkout to 'main'. For version-locked runs, pass inputs.shared_ref matching the @ref used in the caller (e.g., v4.1.0 or v4.1.0-pr.3.7b67a2d)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved shared workflows ref: $REF"

      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}
          path: caller

      - name: Checkout shared workflows repo
        uses: actions/checkout@v7
        with:
          repository: aexionsolutions/azure-devops-workflows
          ref: ${{ steps.wfref.outputs.ref }}
          fetch-depth: 0
          path: shared

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Detect SonarCloud
        id: sonar
        uses: ./shared/.github/actions/sonar-detect
        with:
          requested: ${{ inputs.sonar_enabled }}
          token: ${{ secrets.SONAR_TOKEN }}
          org: ${{ secrets.SONAR_ORG }}
          projectKey: ${{ secrets.SONAR_PROJECT_KEY }}

      - name: Verify SonarCloud project readiness
        if: steps.sonar.outputs.enabled == 'true'
        id: sonar_ready
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -e
          # Ensure project exists
          RESP=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/projects/search?projects=$SONAR_PROJECT_KEY" || echo "")
          if echo "$RESP" | grep -q '\"components\":\[\]'; then
            echo "### SonarCloud: Project '$SONAR_PROJECT_KEY' not found." >> "$GITHUB_STEP_SUMMARY"
            echo "Create the project in your SonarCloud organization, then re-run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Try to detect default branch; if uncertain, do not block
          BR=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/project_branches/list?project=$SONAR_PROJECT_KEY" || echo "")
          if echo "$BR" | jq -e '.branches | map(select(.isMain == true)) | length >= 1' >/dev/null 2>&1; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "### SonarCloud: Could not confirm default branch via API – proceeding anyway. If analysis fails, verify default branch in Project Settings > Branches." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install SonarScanner for .NET
        if: steps.sonar.outputs.enabled == 'true'
        uses: ./shared/.github/actions/sonar-dotnet-begin
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          org: ${{ secrets.SONAR_ORG }}
          projectKey: ${{ secrets.SONAR_PROJECT_KEY }}
          branch: ${{ github.ref_name }}
          pr_key: ${{ inputs.pr_number }}
          pr_branch: ${{ inputs.pr_head }}
          pr_base: ${{ inputs.pr_base }}
          js_lcov: ${{ inputs.js_lcov_path }}
          sonar_exclusions: ${{ inputs.sonar_exclusions }}
          sonar_coverage_exclusions: ${{ inputs.sonar_coverage_exclusions }}
          sonar_infra_exclusions: ${{ inputs.sonar_infra_exclusions }}

      # Sonar begin is handled by the composite above (conditionally)

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} -c Release --no-restore

      - name: Resolve test projects
        id: test_projects
        shell: bash
        run: |
          # Resolve unit test project
          UNIT="${{ inputs.unit_test_project }}"
          if [ -z "$UNIT" ]; then
            UNIT=$(find tests -maxdepth 2 -name '*UnitTest*.csproj' -o -name '*Unit.Test*.csproj' 2>/dev/null | head -n1)
          fi
          if [ -z "$UNIT" ]; then
            echo "::error::No unit test project found. Set 'unit_test_project' input or ensure a *UnitTest*.csproj exists under tests/."
            exit 1
          fi
          echo "unit=$UNIT" >> $GITHUB_OUTPUT
          echo "Resolved unit test project: $UNIT"

      - name: Unit Tests + Coverage (OpenCover)
        run: |
          echo "### Running Unit Tests (Fast Feedback)" >> "$GITHUB_STEP_SUMMARY"

          set +e
          dotnet test ${{ steps.test_projects.outputs.unit }} \
            -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=unit.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          TEST_EXIT=$?
          set -e

          # Guard against test host crash during shutdown (exit 1 with 0 failures)
          TRX=$(find . -name "unit.trx" -type f | head -1)
          if [ $TEST_EXIT -ne 0 ] && [ -n "$TRX" ]; then
            FAILED=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1)
            if [ "${FAILED:-1}" = "0" ]; then
              echo "⚠️ dotnet test exited $TEST_EXIT but TRX shows 0 failures — treating as success (test host crash during shutdown)" >> "$GITHUB_STEP_SUMMARY"
              TEST_EXIT=0
            fi
          fi

          if [ $TEST_EXIT -ne 0 ]; then exit $TEST_EXIT; fi
          
          # Coverage report generation (exclude test assemblies from coverage)
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          # Determine assembly filters (always exclude test assemblies + custom filters)
          # Auto-detect test assemblies by looking at test project names
          TEST_PROJECTS=$(find tests -name '*.csproj' 2>/dev/null | xargs -I {} basename {} .csproj | tr '\n' ';' | sed 's/;$//' | sed 's/;/;-/g')
          if [ -n "$TEST_PROJECTS" ]; then
            ASSEMBLY_FILTERS="-$TEST_PROJECTS"
          fi
          # Append custom filters if provided
          if [ -n "${{ inputs.coverage_assembly_filters }}" ]; then
            if [ -n "$ASSEMBLY_FILTERS" ]; then
              ASSEMBLY_FILTERS="$ASSEMBLY_FILTERS;${{ inputs.coverage_assembly_filters }}"
            else
              ASSEMBLY_FILTERS="${{ inputs.coverage_assembly_filters }}"
            fi
          fi
          
          reportgenerator \
            "-reports:**/coverage.opencover.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:TextSummary" \
            "-assemblyfilters:$ASSEMBLY_FILTERS"
          cat coverage-report/Summary.txt || true

      # Upload unit coverage for the coverage-gate job to merge with integration coverage
      - name: Upload unit coverage
        if: always() && inputs.run_integration == true
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: caller/**/coverage.opencover.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Check coverage threshold
        # Skip when integration tests run in parallel (coverage-gate job merges both)
        if: inputs.run_integration != true
        id: coverage_check
        continue-on-error: true
        shell: bash
        run: |
          set -e
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          
          TEST_PROJECTS=$(find tests -name '*.csproj' 2>/dev/null | xargs -I {} basename {} .csproj | tr '\n' ';' | sed 's/;$//' | sed 's/;/;-/g')
          if [ -n "$TEST_PROJECTS" ]; then
            ASSEMBLY_FILTERS="-$TEST_PROJECTS"
          fi
          if [ -n "${{ inputs.coverage_assembly_filters }}" ]; then
            if [ -n "$ASSEMBLY_FILTERS" ]; then
              ASSEMBLY_FILTERS="$ASSEMBLY_FILTERS;${{ inputs.coverage_assembly_filters }}"
            else
              ASSEMBLY_FILTERS="${{ inputs.coverage_assembly_filters }}"
            fi
          fi
          
          reportgenerator \
            "-reports:**/coverage.opencover.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:TextSummary" \
            "-assemblyfilters:$ASSEMBLY_FILTERS" \
            "-classfilters:-*RegexGenerator*" \
            "-filefilters:-**/obj/**"

          if [ ! -f coverage-report/Summary.txt ]; then
            echo "Coverage summary not found; skipping enforcement." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Coverage Gate" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          LINE_COV=$(grep -Eo 'Line coverage: [0-9]+(\.[0-9]+)?%' coverage-report/Summary.txt | grep -Eo '[0-9]+(\.[0-9]+)?' | head -n1)
          THRESHOLD=${{ inputs.coverage_threshold }}

          if [ -z "$LINE_COV" ]; then
            echo "Could not parse line coverage from Summary.txt" >&2
            cat coverage-report/Summary.txt
            exit 1
          fi

          echo "Coverage: ${LINE_COV}% | Threshold: ${THRESHOLD}%"
          
          if awk -v cov="$LINE_COV" -v thr="$THRESHOLD" 'BEGIN { exit ((cov+0) < (thr+0)) }'; then
            echo "✅ Coverage ${LINE_COV}% >= threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "COVERAGE_PASSED=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Coverage ${LINE_COV}% is below threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Coverage ${LINE_COV}% is below threshold ${THRESHOLD}% - will fail after SonarCloud upload"
            echo "COVERAGE_PASSED=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Web unit tests + coverage (vitest)
        if: inputs.run_web_unit_tests == true
        working-directory: caller/${{ inputs.web_working_directory }}
        run: |
          rm -f package-lock.json
          npm install
          npm run test:ci

      - name: Upload web coverage artifact
        if: always() && inputs.run_web_unit_tests == true
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: caller/${{ inputs.web_working_directory }}/coverage/**
          if-no-files-found: warn
          retention-days: 7

      - name: Debug coverage files for Sonar
        if: steps.sonar.outputs.enabled == 'true'
        shell: bash
        run: |
          shopt -s globstar || true
          COUNT=$(ls -1 **/coverage.opencover.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Found OpenCover files: ${COUNT:-0}"
          ls -1 **/coverage.opencover.xml 2>/dev/null | head -n 5 || true

      - name: SonarCloud End
        if: steps.sonar.outputs.enabled == 'true'
        uses: ./shared/.github/actions/sonar-dotnet-end
        with:
          token: ${{ secrets.SONAR_TOKEN }}

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-ci-artifacts
          path: |
            **/TestResults/**
            caller/coverage-report/**
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Detect code changes
        id: code_changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Check if any actual code files changed (not just workflows/docs)
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} || echo "")
          CODE_CHANGED=false
          
          if echo "$CHANGED_FILES" | grep -qE '\.(cs|csproj|sln)$'; then
            CODE_CHANGED=true
            echo "📝 Code files changed - coverage enforcement applies"
          else
            echo "ℹ️ No code files changed - skipping coverage enforcement"
          fi
          
          echo "CODE_CHANGED=$CODE_CHANGED" >> $GITHUB_OUTPUT
          echo "::notice::Code changed: $CODE_CHANGED"

      - name: Enforce coverage threshold (final)
        if: inputs.run_integration != true && inputs.enforce_coverage == true && steps.coverage_check.outputs.COVERAGE_PASSED == 'false' && (github.event_name != 'pull_request' || steps.code_changes.outputs.CODE_CHANGED == 'true')
        shell: bash
        run: |
          echo "::error::Coverage threshold not met - see coverage check step for details"
          exit 1

      - name: Summarize CI
        shell: bash
        run: |
          echo "## .NET CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-report/Summary.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Integration Tests (runs in PARALLEL with build-and-unit-tests) ─────────
  # Separate job so unit tests + SonarCloud run concurrently with integration tests.
  # Each job builds independently (~1.5 min build cost) to avoid artifact overhead.
  # Net saving: ~7 min wall-clock (unit ~6 min + integration ~7 min sequential → max(6,7) parallel).
  # NOTE for repositories using this reusable workflow:
  #   - Branch protection rules that require specific checks must include
  #     `build-and-unit-tests`, `integration-tests`, and `coverage-gate`.
  #   - `build-and-unit-tests` can pass while `integration-tests` is still running;
  #     rely on the overall workflow status or wait for `coverage-gate`.
  integration-tests:
    if: inputs.run_integration == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CALLER_WORKDIR: caller

    defaults:
      run:
        working-directory: caller

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: ${{ inputs.postgres_db || 'ci_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}
          path: caller

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} -c Release --no-restore

      - name: Resolve integration test project
        id: test_projects
        shell: bash
        run: |
          INTEG="${{ inputs.integration_test_project }}"
          if [ -z "$INTEG" ]; then
            INTEG=$(find tests -maxdepth 2 -name '*IntegrationTest*.csproj' -o -name '*Integration.Test*.csproj' 2>/dev/null | head -n1)
          fi
          if [ -z "$INTEG" ]; then
            echo "::error::No integration test project found. Set 'integration_test_project' input or ensure a *IntegrationTest*.csproj exists under tests/."
            exit 1
          fi
          echo "integration=$INTEG" >> $GITHUB_OUTPUT
          echo "Resolved integration test project: $INTEG"

      - name: Integration Tests + Coverage (OpenCover)
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${{ inputs.postgres_db || 'ci_test' }};Username=postgres;Password=test_password_123"
        run: |
          echo "### Running Integration Tests (Database + HTTP)" >> "$GITHUB_STEP_SUMMARY"
          echo "Using Docker PostgreSQL service (ephemeral, isolated)" >> "$GITHUB_STEP_SUMMARY"

          set +e
          dotnet test ${{ steps.test_projects.outputs.integration }} \
            -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=integration.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          TEST_EXIT=$?
          set -e

          # The test host can crash during shutdown (e.g. Docker containers torn
          # down while xUnit cleanup runs), producing exit-code 1 even when every
          # test passed.  Parse the TRX to decide the real outcome.
          TRX=$(find . -name "integration.trx" -type f | head -1)
          if [ $TEST_EXIT -ne 0 ] && [ -n "$TRX" ]; then
            FAILED=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1)
            OUTCOME=$(grep -oP 'outcome="\K[^"]+' "$TRX" | head -1)
            if [ "${FAILED:-1}" = "0" ]; then
              echo "⚠️ dotnet test exited $TEST_EXIT but TRX shows 0 failures — treating as success (test host crash during shutdown)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          exit $TEST_EXIT

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: caller/**/coverage.opencover.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-artifacts
          path: |
            **/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  # ─── Coverage Gate (runs after BOTH test jobs) ──────────────────────────────
  # Merges unit + integration coverage and enforces the threshold.
  coverage-gate:
    if: always() && inputs.run_integration == true && inputs.enforce_coverage == true
    needs: [build-and-unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fail fast if a test job failed
        if: needs.build-and-unit-tests.result == 'failure' || needs.integration-tests.result == 'failure'
        run: |
          echo "::error::One or more test jobs failed — skipping coverage merge."
          exit 1

      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          sparse-checkout: tests
          sparse-checkout-cone-mode: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download integration coverage
        uses: actions/download-artifact@v8
        with:
          name: integration-coverage
          path: coverage/integration

      - name: Merge coverage and check threshold
        shell: bash
        run: |
          set -e
          dotnet tool install -g dotnet-reportgenerator-globaltool || true

          # Auto-detect test assemblies to exclude from coverage
          TEST_PROJECTS=$(find tests -name '*.csproj' 2>/dev/null | xargs -I {} basename {} .csproj | tr '\n' ';' | sed 's/;$//' | sed 's/;/;-/g')
          ASSEMBLY_FILTERS=""
          if [ -n "$TEST_PROJECTS" ]; then
            ASSEMBLY_FILTERS="-$TEST_PROJECTS"
          fi
          if [ -n "${{ inputs.coverage_assembly_filters }}" ]; then
            if [ -n "$ASSEMBLY_FILTERS" ]; then
              ASSEMBLY_FILTERS="$ASSEMBLY_FILTERS;${{ inputs.coverage_assembly_filters }}"
            else
              ASSEMBLY_FILTERS="${{ inputs.coverage_assembly_filters }}"
            fi
          fi

          echo "Found coverage files:"
          find coverage -name 'coverage.opencover.xml' | head -n 10

          reportgenerator \
            "-reports:coverage/**/coverage.opencover.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:TextSummary" \
            "-assemblyfilters:$ASSEMBLY_FILTERS" \
            "-classfilters:-*RegexGenerator*" \
            "-filefilters:-**/obj/**"

          if [ ! -f coverage-report/Summary.txt ]; then
            echo "::error::Coverage summary not found after merge."
            exit 1
          fi

          echo "### Merged Coverage Gate (unit + integration)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          LINE_COV=$(grep -Eo 'Line coverage: [0-9]+(\.[0-9]+)?%' coverage-report/Summary.txt | grep -Eo '[0-9]+(\.[0-9]+)?' | head -n1)
          THRESHOLD=${{ inputs.coverage_threshold }}

          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not parse line coverage from Summary.txt"
            cat coverage-report/Summary.txt
            exit 1
          fi

          echo "Merged coverage: ${LINE_COV}% | Threshold: ${THRESHOLD}%"

          if awk -v cov="$LINE_COV" -v thr="$THRESHOLD" 'BEGIN { exit ((cov+0) < (thr+0)) }'; then
            echo "✅ Merged coverage ${LINE_COV}% >= threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Merged coverage ${LINE_COV}% is below threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage ${LINE_COV}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
