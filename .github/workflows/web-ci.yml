name: Reusable Web CI (Next.js)

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (tag/sha/branch) to test. Required for promote-release to ensure tests match the build version.'
        required: false
        type: string
      working_directory:
        required: false
        type: string
        default: web
      run_tests:
        required: false
        type: boolean
        default: true
      node_version:
        required: false
        type: string
        default: '20'
      job_timeout_minutes:
        description: 'Timeout for the job. Lint and build take about 3 minutes, unit tests about 10 more; a hung job otherwise runs for GitHub''s 6-hour default.'
        required: false
        type: number
        default: 30

jobs:
  # Lints, unit-tests (when run_tests) and builds the web app. Browser (E2E) tests run in web-e2e-ci.yml.
  web-ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install deps
        working-directory: ${{ inputs.working_directory }}
        # Install exactly what the committed lockfile records. Deleting it and resolving afresh tested a different
        # dependency tree each run, and broke whenever the registry did ("Cannot read properties of null (reading
        # 'edgesOut')", RavenXpress, 2026-10-15). Callers without a lockfile still resolve with npm install.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (if present)
        working-directory: ${{ inputs.working_directory }}
        run: npm run lint --if-present

      # Unit tests only (npm test). No browsers are installed: browser tests belong to web-e2e-ci.yml.
      - name: Test (if enabled)
        if: inputs.run_tests == true
        working-directory: ${{ inputs.working_directory }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ inputs.working_directory }}
        run: npm run build
